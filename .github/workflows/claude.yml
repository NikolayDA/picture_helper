name: Claude Code

# Interaktiver Claude-Agent: reagiert auf "@claude"-Erwähnungen in Issues,
# Pull Requests, PR-Reviews und Review-Kommentaren. Deckt die On-Demand-Agents
# (Bug-Fix, Tests, Dokumentation, Performance) aus .github/agents/*.yml ab –
# die konkrete Aufgabe wird direkt in der Erwähnung beschrieben, z. B.
# "@claude fixe den fehlschlagenden Test in tests/test_height_ops.py".
#
# Voraussetzung: Ein Repo-Secret CLAUDE_CODE_OAUTH_TOKEN (Settings → Secrets
# and variables → Actions), lokal erzeugt mit `claude setup-token`. Der Lauf
# rechnet damit über das Claude-Abo (Pro/Max/Team/Enterprise) statt über eine
# API-Abrechnung; das Token hängt am Abo der Person, die es erzeugt hat.
# Alternativ ANTHROPIC_API_KEY – dann unten wieder das Input
# `anthropic_api_key` einsetzen. Ohne Secret wird der Claude-Schritt sauber
# übersprungen (kein roter Lauf).

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  issues:
    types: [opened, assigned]

concurrency:
  group: claude-${{ github.event.issue.number || github.event.pull_request.number || github.run_id }}
  cancel-in-progress: false

jobs:
  claude:
    # Nur laufen, wenn "@claude" tatsächlich erwähnt wurde.
    # Trigger-Rauschen aus #828 (sieben Thread-Antworten erzeugten 14 Läufe):
    # Dieses Job-`if` ist bereits die engste verfügbare Filterung. GitHub
    # filtert Ereignisse nur nach Typ, Branch, Pfad und Tag, nicht nach
    # Kommentartext – der Lauf wird also angelegt und sofort übersprungen. Der
    # Eintrag in der Checkliste ist die Anzeige dieses Übersprungs, kein
    # Verbrauch. Enger ginge es nur, indem man Ereignistypen ganz aufgibt (etwa
    # keine Review-Kommentare mehr); dann bliebe eine Erwähnung dort
    # unbeantwortet – der schlechtere Tausch.
    if: >-
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read  # Damit Claude CI-Ergebnisse auf PRs lesen kann.
    env:
      HAS_CLAUDE_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Hinweis bei fehlendem Secret
        if: env.HAS_CLAUDE_TOKEN != 'true'
        run: |
          echo "::warning::CLAUDE_CODE_OAUTH_TOKEN ist nicht gesetzt – Claude-Schritt \
          übersprungen. Token lokal mit 'claude setup-token' erzeugen und unter \
          Settings → Secrets and variables → Actions ergänzen."

      - name: Run Claude Code
        id: claude
        if: env.HAS_CLAUDE_TOKEN == 'true'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Standard-GITHUB_TOKEN statt der Claude-GitHub-App – so genügt das
          # Abo-Token als einziges Secret. Hinweis: Commits, die Claude damit pusht,
          # lösen keine nachgelagerten Workflows aus (GITHUB_TOKEN-Limit). Wer
          # das braucht, installiert die Claude-GitHub-App und entfernt diese
          # Zeile (siehe .github/agents/README.md).
          github_token: ${{ secrets.GITHUB_TOKEN }}
          trigger_phrase: "@claude"
          # Projektkontext (make check als Gate, Konventionen, N6-Drift) liest
          # Claude Code automatisch aus CLAUDE.md im Repo-Root.
          # Achtung: `claude_args` ist ein Block-Skalar – jede Zeile darin geht
          # als CLI-Argument an Claude Code. Erklärungen gehören deshalb hier
          # herauf, nicht zwischen die Argumente.
          # --model: dasselbe Modell wie im Review-Workflow. Dieser Agent
          # schreibt Code, das nur lesende Review liefe sonst auf dem stärkeren
          # Modell als der schreibende Teil. Fest benannt statt Alias `opus` –
          # dafür wandert die Zeile nicht mit: Bei Modell-/Auth-Fehlern in
          # diesem Job zuerst hier schauen.
          claude_args: |
            --max-turns 25
            --model claude-opus-5

      # Lesart der Ablehnungen in diesem Workflow: Anders als beim rein
      # bewertenden Review gibt es hier keine Allowlist, der Job hält
      # `contents: write`, und die Aufgabe ist ausdrücklich Code schreiben,
      # testen und committen. Eine abgelehnte Ausführung oder ein abgelehnter
      # Schreibzugriff ist deshalb NICHT erwartbar, sondern genau der Befund,
      # der die Aufgabe blockiert hat. Die Ablehnungsklassen des
      # Review-Workflows dürfen hier nicht übernommen werden – sie würden die
      # interessanten Fälle als „normal" abstempeln. Bewusst ohne Aufzählung:
      # Eine ausgeschriebene Liste driftet mit jeder neuen Klasse.

      # Abgelehnte Werkzeugaufrufe sichtbar machen (#825). Statt der vollen
      # SDK-Ausgabe (`show_full_output`, weltlesbarer Joblog) wird gezielt nur
      # `permission_denials` aus dem Protokoll der Action gezogen. Zweimal war
      # genau das die entscheidende Information: Ein Agent, der eine Quelle
      # nicht abrufen darf, rät stillschweigend statt nachzuschlagen, und
      # abgelehnte Aufrufe verbrauchen zusätzlich Turns bis zum Budgetende.
      # Der Block ist in beiden Claude-Workflows wortgleich;
      # tests/test_claude_workflow_diagnostics.py hält ihn synchron.
      # `continue-on-error`: Die Diagnose darf einen sonst grünen Lauf nie rot
      # färben. Das Gating hängt am Schritt-Ergebnis statt am Output-Pfad –
      # bricht die Action früh ab (Auth, Nutzungslimit, Modell nicht gedeckt),
      # gibt es kein `execution_file`, und genau dann wird die Diagnose am
      # dringendsten gebraucht.
      - name: Abgelehnte Werkzeugaufrufe ausweisen
        if: always() && steps.claude.outcome != 'skipped'
        continue-on-error: true
        env:
          EXECUTION_FILE: ${{ steps.claude.outputs.execution_file }}
        run: |
          set -euo pipefail
          if [ ! -f "$EXECUTION_FILE" ]; then
            echo "Kein Protokoll unter '$EXECUTION_FILE' – nichts auszuwerten."
            exit 0
          fi
          # Ein jq-Fehler darf nicht als "0 Ablehnungen" durchgehen: Das wäre im
          # Log nicht vom sauberen Lauf zu unterscheiden – dieselbe Falle, die
          # CLAUDE.md für den ClamAV-Scan ausschließt ("ein still übersprungener
          # Scan gilt nie als bestanden"). Der Abschluss-Datensatz liegt je nach
          # Ausgabeform verschieden tief; die rekursive Suche findet ihn so oder so.
          # `keys` mitschreiben: Ob ein Ablehnungsdatensatz einen Grund nennt,
          # ist von außen nicht bekannt, und ohne Grund lässt sich die Ursache
          # einer Ablehnung nur aus Kommando plus Allowlist-Stand erschließen.
          # Die Feldliste beantwortet das im nächsten echten Lauf, ohne fremden
          # Inhalt unbesehen ins Log zu kippen.
          # Die Typprüfung steht dabei VOR jedem Feldzugriff, nicht als
          # `keys?`-Rückfall dahinter: `.tool_name` bricht auf jedem
          # Nicht-Objekt außer `null` mit „Cannot index …" ab, bevor ein
          # Rückfall überhaupt erreichbar wäre – nachgestellt mit einem
          # String-Eintrag, Exit 5. Das ganze `jq` scheitert dann, der
          # `if !`-Zweig meldet „nicht auswertbar" und der Lauf verliert die
          # Ablehnungsliste vollständig. So bleibt der Rest der Liste erhalten
          # und der kaputte Datensatz wird als solcher sichtbar.
          # Die Typprüfung gilt für Container UND Elemente. `.permission_denials[]?`
          # allein haerte nur die Elemente: Ist das Feld selbst kein Array
          # (String, Zahl, `null`), schluckt `[]?` den Fehler, `jq` laeuft
          # durch, `count` wird 0 und der Joblog meldet „Abgelehnte Aufrufe:
          # 0" — der stille Durchlauf, den dieser Schritt gerade ausschliessen
          # soll. Nachgestellt mit beiden Formen. Jetzt steht dort eine
          # eigene Zeile, die den Typ nennt; count wird 1 statt 0.
          # Das abschliessende `gsub` macht „genau eine Ausgabezeile je
          # Ablehnung" strukturell wahr, statt pro Feld: `tool_name` und die
          # Feldnamen gehen roh in die Interpolation, und ein Zeilenumbruch
          # darin ist in JSON zulaessig – nachgestellt, `count` sprang auf 2.
          # So haengt die Zusicherung nicht daran, dass jeder kuenftige
          # Feldzugriff daran denkt.
          # `tojson` statt `tostring`: Auf einem String ist `tostring` die
          # Identität, ein mehrzeiliger Datensatz erzeugte also mehrere
          # Ausgabezeilen – und `count` zählt direkt darunter mit `wc -l`.
          # Nachgestellt: ein dreizeiliger String meldete „Abgelehnte
          # Aufrufe: 4" statt 2. Dieselbe Falle wie beim verworfenen
          # `permission_denials_count`-Fallback: eine Zahl, die nicht zur
          # Liste passt. Auf Objekten sind beide identisch.
          if ! denials=$(jq -r '.. | objects | select(has("permission_denials"))
                                | if (.permission_denials | type) == "array"
                                  then .permission_denials[]
                                       | if type == "object"
                                         then "\(.tool_name // "?") [Felder: \(keys | join(","))]: "
                                              + "\(.tool_input | tojson | .[0:300])"
                                         else "[ANOMALIE] Nicht-Objekt: \(type): \(tojson | .[0:300])"
                                         end
                                  else "[ANOMALIE] permission_denials ist \(.permission_denials | type), kein Array"
                                  end
                                | gsub("\n"; " ")' \
            "$EXECUTION_FILE"); then
            echo "::warning::Protokoll nicht auswertbar – abgelehnte Aufrufe unbekannt."
            exit 0
          fi
          # Anzahl aus der Liste selbst zählen: `permission_denials_count` steht
          # in einem anderen Datensatz als `permission_denials`, ein Fallback
          # darauf meldete sonst "0" neben einer nicht leeren Liste.
          # Anomalien zählen getrennt. `has("permission_denials")` ist auch für
          # ein explizites `null` wahr; liefe die Anomaliezeile in dieselbe
          # Zahl, färbte ein Serialisierer, der die leere Liste als `null`
          # schreibt, jeden sauberen Lauf – und das Kriterium von #841 lautet
          # wörtlich „null Ablehnungen". Fail-closed bleibt: Die Zeile wird
          # ausgegeben, nur eben als eigene Größe.
          count=0
          anomalien=0
          if [ -n "$denials" ]; then
            count=$(printf '%s\n' "$denials" | grep -cv '^\[ANOMALIE\] ' || true)
            anomalien=$(printf '%s\n' "$denials" | grep -c '^\[ANOMALIE\] ' || true)
          fi
          jq -r '.. | objects | select(has("num_turns"))
                 | "Lauf: \(.subtype // "?"), Turns: \(.num_turns)"' \
            "$EXECUTION_FILE" || true
          # Wortlaut und Reihenfolge: Bei ausschliesslich Anomalien stand hier
          # zuerst woertlich „Abgelehnte Aufrufe: 0" – genau die Zeichenkette,
          # nach der beim Auswerten von #841 gesucht wird. Sie behauptete
          # etwas, das der Schritt nicht wissen kann: Die Liste ist
          # *unbekannt*, nicht leer. Ist etwas nicht auswertbar, nennt die
          # Zeile deshalb keine Zahl, die als Urteil gelesen werden koennte –
          # auch nicht als Teilkette. Der saubere Fall bleibt unveraendert.
          if [ "$anomalien" -gt 0 ]; then
            echo "::warning::Nicht auswertbare Datensätze: $anomalien"
            echo "Abgelehnte Aufrufe: unbestimmt ($count auswertbar, $anomalien nicht auswertbar)"
          else
            echo "Abgelehnte Aufrufe: $count"
          fi
          if [ "$count" -gt 0 ] || [ "$anomalien" -gt 0 ]; then
            printf '%s\n' "$denials"
          fi
