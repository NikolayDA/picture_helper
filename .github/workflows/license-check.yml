name: License Check

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  license-check:
    runs-on: ubuntu-latest
    # This job installs and executes pull-request-controlled repository code.
    # Keep its token read-only and out of the checkout's Git configuration.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          # Kein `fetch-depth: 0`: Die volle History existierte allein fuer
          # `git log -- LICENSES.md` im Datumsschritt unten. Der liest den
          # Stempel jetzt aus der Datei selbst, und die Drift-Pruefung nutzt
          # nur `git diff` gegen den Arbeitsbaum – beides kommt ohne History
          # aus.

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project dependencies (runtime + ai + test)
        run: |
          python -m pip install --upgrade "pip>=26.1.2"
          python -m pip install --constraint requirements/constraints.txt ".[ai,test]"

      - name: Install license tooling (pip-licenses)
        run: python -m pip install pip-licenses

      - name: Generate license report
        run: |
          # Stabiles Datum fuer den Drift-Vergleich: Der "Stand:"-Stempel
          # kommt aus der COMMITTETEN LICENSES.md, nicht aus der Git-Historie.
          # Der frueher genutzte Committer-Zeitstempel
          # (`git log -1 --format=%cd -- LICENSES.md`) ueberlebt den
          # Squash-Merge nicht: `main` squasht, der Squash-Commit traegt den
          # MERGE-Zeitpunkt statt des Edit-Zeitpunkts. Ein Merge nach
          # UTC-Mitternacht machte den fail-closed Vergleich unten auf `main`
          # rot, obwohl sich am Abhaengigkeits-Snapshot nichts geaendert hatte
          # (Review-Befund zu PR #877). Der Snapshot-Schutz bleibt vollstaendig
          # erhalten – selbstbezueglich ist ausschliesslich die Datumszeile,
          # jede inhaltliche Abweichung schlaegt weiter fehl. Der Ausdruck
          # muss zur deutschen "Stand:"-Zeile aus
          # scripts/generate_license_report.py passen;
          # tests/test_license_check_date.py haelt beide synchron.
          # Faellt zurueck auf 'heute', wenn die Datei fehlt oder keine
          # Datumszeile traegt (z. B. frischer Branch ohne LICENSES.md).
          # Das `|| true` haelt diesen Rueckfall auch dann offen, wenn der Step
          # einmal unter `pipefail` laeuft (`shell: bash` am Step oder ein
          # `defaults: run: shell: bash` setzen `-eo pipefail`): `sed` liefert
          # bei fehlender Datei Exit 2, und mit `pipefail` risse das die
          # Zuweisung samt Step ab, statt auf 'heute' zu gehen. Ohne
          # `pipefail` - dem heutigen Default `bash -e {0}` - zaehlt ohnehin
          # nur der Status von `head`.
          gen_date="$(sed -n 's/^> Stand: \([0-9]\{4\}-[0-9]\{2\}-[0-9]\{2\}\) .*/\1/p' LICENSES.md 2>/dev/null | head -n 1 || true)"
          if [ -z "$gen_date" ]; then
            gen_date="$(date -u +%Y-%m-%d)"
          fi
          python scripts/generate_license_report.py \
            --report license-report.md \
            --summary license-summary.md \
            --generated-date "$gen_date" \
            --all-langs

      - name: Raw dependency/license dump (reference)
        run: |
          pip-licenses --format=markdown --with-authors --with-urls \
            --order=license > license-raw-all-installed.md || true

      - name: Refresh committed LICENSES.md
        run: |
          cp license-report.md LICENSES.md
          drift=0
          if ! git diff --quiet -- LICENSES.md; then
            echo "::error::LICENSES.md weicht vom generierten Report ab – bitte aktualisiert committen."
            git --no-pager diff -- LICENSES.md
            drift=1
          fi
          for lang in en es fr uk zh; do
            f="docs/i18n/$lang/LICENSES.md"
            if ! git diff --quiet -- "$f"; then
              echo "::error::$f weicht vom generierten Report ab – bitte aktualisiert committen."
              git --no-pager diff -- "$f"
              drift=1
            fi
          done
          if [ "$drift" -ne 0 ]; then
            exit 1
          fi

      - name: Upload license report artifact
        uses: actions/upload-artifact@v7
        with:
          name: license-report
          path: |
            license-report.md
            license-summary.md
            license-raw-all-installed.md
          if-no-files-found: error

  comment-summary:
    name: Comment license summary
    needs: license-check
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    # The write token is isolated from PR code: this job only downloads text
    # produced by the read-only job and passes it to GitHub's comment API.
    permissions:
      pull-requests: write
    steps:
      - name: Download license summary
        uses: actions/download-artifact@v8
        with:
          name: license-report

      - name: Comment summary on pull request
        continue-on-error: true
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- license-check-summary -->';
            const body = marker + '\n' +
              fs.readFileSync('license-summary.md', 'utf8');
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const { data: comments } = await github.rest.issues.listComments({
              owner, repo, issue_number, per_page: 100,
            });
            const existing = comments.find(
              c => c.body && c.body.includes(marker)
            );
            if (existing) {
              await github.rest.issues.updateComment({
                owner, repo, comment_id: existing.id, body,
              });
            } else {
              await github.rest.issues.createComment({
                owner, repo, issue_number, body,
              });
            }
