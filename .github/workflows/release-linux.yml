name: Release artifacts (Linux + macOS)

# Builds portable, self-contained release candidates, but never publishes them:
#   - Linux AppImage + .deb for x86_64 and aarch64 (Raspberry Pi OS / arm64)
#   - macOS .dmg (BgRemover.app) for Apple Silicon (arm64)
# The workflow is dispatch-only. Hardware acceptance and publication are
# separate workflows bound to this run and its immutable artifacts (#744).
# The downloadable artifacts bundle rembg/onnxruntime AI by default.
#
# Artifact naming (#584): ``BgRemover-<version>-<platform_tag>[-ai].<ext>``,
# e.g. ``BgRemover-2.6.0-linux-raspberrypi-arm64-ai.AppImage``. ``platform_tag``
# spells out OS *and* device (``linux-x86_64`` / ``linux-raspberrypi-arm64`` /
# ``macos-arm64``) instead of a bare architecture — a raw ``arm64`` cannot tell
# a Raspberry Pi .deb apart from the macOS .dmg. The ``-ai`` suffix is only
# appended when the AI stack (rembg/onnxruntime) is actually bundled, so it is
# visible per file whether that build has the same integrated AI model as the
# macOS one, instead of only being documented out-of-band.
#
# Release-Gate (#250/#742): Vor jedem Kandidatenbau gelten zwei harte
# Vorbedingungen, technisch ueber ``needs`` erzwungen:
#   1. ``verify-candidate`` – der gebaute Laufkopf
#      stimmt mit ``GITHUB_SHA`` ueberein, alle Commits und Pfade seit der
#      eingefrorenen Basis sind explizit klassifiziert, und die abgeleitete
#      Provenienz wird als Actions-Artefakt an Run und Policy gebunden.
#   2. ``test`` – die massgebliche Full-CI-Matrix (ci.yml, als
#      wiederverwendbarer Workflow aufgerufen) ist fuer EXAKT diesen Commit
#      gruen (Linux/macOS x Python 3.10-3.13).
# ``build`` haengt an beiden. Dieser Workflow besitzt absichtlich weder einen
# Tag-Trigger noch Schreibrechte oder einen Publish-Job. ``release-publish.yml``
# kann spaeter ausschliesslich die hier erzeugten, abgenommenen Bytes laden.
#
# Der Linux-Build buendelt nur das bgremover-Wheel + Abhaengigkeiten ins
# AppImage; der macOS-Build packt sie via PyInstaller ins .app-Bundle. Beide
# laufen in einem isolierten venv und installieren das Projekt nicht in den
# Runner (kein pip-Pin noetig, vgl. tests/test_ci_pip_pin.py).
on:
  workflow_dispatch:
    inputs:
      with_ai:
        description: 'Bundle rembg (AI background removal) into the artifacts'
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  # Gate 1: abgeleitetes Freeze-/Provenienz-Gate fuer den manuellen
  # Kandidatenbau (#742/#743). Ein Tag existiert in dieser Phase bewusst noch
  # nicht; Pfadklassifikation und Laufkopfbindung sind fail-closed.
  verify-candidate:
    name: Verify candidate provenance
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 + Tags: das Freeze-Gate leitet den Kandidaten aus der
      # Historie seit dem Basis-Tag ab und braucht dafuer das ganze Fenster.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      # Gate 1b (#742/#743): Der Laufkopf ist der Kandidat. Freeze-Dokument und
      # Policy enthalten nur vor dem Merge bekannte Angaben; Commitliste,
      # Pfadklassen und Zaehler werden aus der First-Parent-Historie abgeleitet.
      # Unbekannte Pfade sind fail-closed kandidatenrelevant UND blockierend.
      # Die JSON-Evidenz bindet Basis, github.sha, Policy-Digest und Run-IDs,
      # ohne einen selbstreferenziellen Pin-/Ledger-Nachtrag zu verlangen.
      - name: Release-Freeze-Gate und Provenienz
        run: >-
          python scripts/verify_release_freeze.py
          --output-provenance release-evidence/release-freeze-provenance.json

      # upload-artifact v4+ erzeugt je Upload ein unveraenderliches Artefakt mit
      # eigener ID und Digest. Der Attempt im Namen verhindert Kollisionen bei
      # "Re-run failed jobs"; #744 kann genau diesen Nachweis konsumieren.
      - name: Upload release freeze provenance
        uses: actions/upload-artifact@v7
        with:
          name: release-freeze-provenance-${{ github.run_attempt }}
          path: release-evidence/release-freeze-provenance.json
          if-no-files-found: error
          retention-days: 90

  # Gate 2: Massgebliche Full-CI-Matrix fuer exakt diesen Commit – derselbe
  # wiederverwendbare Workflow, den auch der Wochen-Cron faehrt. Haengt am
  # validierten Kandidaten; ein ungueltiger Freeze-/Provenienzstand startet die
  # teure Matrix gar nicht erst (#257/#744).
  test:
    needs: verify-candidate
    # ci.yml fordert ``id-token: write`` (tokenloser Codecov-OIDC-Upload, #303).
    # Ein per ``uses`` aufgerufener Workflow darf NICHT mehr Rechte verlangen als
    # der Aufrufer gewaehrt – sonst lehnt GitHub den GESAMTEN Run bereits beim
    # Start ab (startup_failure, keine Jobs). Das Recht hier explizit
    # durchreichen, damit das Release-Gate ueberhaupt anlaeuft (und der
    # OIDC-Upload auch im Release-Kontext funktioniert).
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/ci.yml

  # Ein Build-Job mit plattformuebergreifender Matrix: zwei Linux-Arches
  # (AppImage + .deb) und ein macOS-arm64-Leg (.dmg). Bewusst EIN Job, damit
  # der gesamte Kandidatenlauf nur bei drei gruenen Legs erfolgreich ist.
  build:
    name: ${{ matrix.os }} ${{ matrix.arch }}
    needs: [verify-candidate, test]
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            runner: ubuntu-24.04
            arch: x86_64
            deb_arch: amd64
            platform_tag: linux-x86_64
          - os: linux
            runner: ubuntu-24.04-arm   # native arm64 runner → Raspberry Pi OS
            arch: aarch64
            deb_arch: arm64
            platform_tag: linux-raspberrypi-arm64
          - os: macos
            runner: macos-latest        # native Apple Silicon (arm64)
            arch: arm64
            platform_tag: macos-arm64
    env:
      # appimagetool needs FUSE to run; extract-and-run avoids requiring it
      # (and the FUSE2 package) on the CI runner. Harmlos/ungenutzt auf macOS.
      APPIMAGE_EXTRACT_AND_RUN: '1'
      # #307/#308: ob die Artefakte rembg/onnxruntime bündeln. Dieselbe
      # Bedingung wie der ``--ai``-Schalter der Build-Schritte – steuert den
      # KI-Selbsttest und die erlaubte Instanzzahl des Fork-Bomb-Wächters.
      WITH_AI: ${{ inputs.with_ai && '1' || '0' }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      # #685: Provenienz jedes Kandidatenartefakts direkt im Build-Log
      # nachweisbar machen – Produktversion, voller Commit-SHA und
      # Workflow-/Run-ID identifizieren, aus welchem gebuildet wurde, plus die
      # Runner-Toolchain. Alle fuenf Matrix-Legs eines Laufs teilen sich
      # ``github.sha``/``github.run_id`` – ein Diff der Logs belegt damit
      # denselben Kandidaten je Artefakt. Dies ist NICHT die Toolchain, die
      # die Artefakte tatsaechlich baut (Bundler laufen in einer isolierten
      # venv, s. u.) – nur der Runner-Python, der diese venv erst anlegt.
      - name: Log build provenance (version, commit, run, runner toolchain)
        run: |
          set -euo pipefail
          project_version="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          echo "Produktversion: $project_version"
          echo "Commit-SHA: ${GITHUB_SHA}"
          echo "Workflow: ${GITHUB_WORKFLOW} | Run-ID: ${GITHUB_RUN_ID} | Run-Attempt: ${GITHUB_RUN_ATTEMPT} | Trigger: ${GITHUB_EVENT_NAME}"
          echo "Matrix-Leg: ${{ matrix.os }} ${{ matrix.arch }} (${{ matrix.platform_tag }})"
          echo "Runner: ${RUNNER_OS} / ${RUNNER_ARCH}"
          python3 --version
          pip --version

      # ── Linux: AppImage + .deb ──────────────────────────────────────────
      - name: Build AppImage
        if: matrix.os == 'linux'
        run: ./packaging/linux/build_appimage.sh ${{ inputs.with_ai && '--ai' || '' }}

      # #709-Review: der Runner-``pip`` oben ist nicht der Bundler, der das
      # Artefakt tatsaechlich baut – build_appimage.sh legt dafuer eine
      # isolierte ``toolenv``-venv an und installiert dort unversioniert
      # (``--upgrade``) ``build`` + ``python-appimage``. Ohne diesen Schritt
      # fehlt genau die Toolchain-Version, die die Provenienzaussage
      # eigentlich belegen soll. Die venv bleibt nach dem Build erhalten
      # (kein Cleanup im Skript), daher hier direkt abfragbar.
      - name: Log actual AppImage bundler versions (Linux)
        if: matrix.os == 'linux'
        run: |
          set -euo pipefail
          toolenv="build/appimage/toolenv"
          echo ">> Tatsaechlich verwendete Bundler-Versionen (aus $toolenv):"
          "$toolenv/bin/pip" list --format=freeze | grep -Ei '^(build|python-appimage)=='

      - name: Build .deb (wraps the AppImage)
        if: matrix.os == 'linux'
        run: ./packaging/linux/build_deb.sh

      - name: Collect Linux artifacts
        if: matrix.os == 'linux'
        run: |
          mkdir -p dist
          cp build/appimage/*.AppImage dist/
          cp build/deb/*.deb dist/
          ls -lh dist/
          # #584: SHA-256 je Artefakt fuer die Kandidaten-Gate-Doku direkt im
          # Job-Log sichtbar machen (kein zusaetzlicher Download noetig).
          sha256sum dist/*

      - name: Verify built Linux artifacts
        if: matrix.os == 'linux'
        run: |
          set -euo pipefail
          shopt -s nullglob
          project_version="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          appimages=(dist/*.AppImage)
          debs=(dist/*.deb)
          test "${#appimages[@]}" -eq 1 || { echo "::error::erwarte genau ein AppImage, habe ${#appimages[@]}"; exit 1; }
          test "${#debs[@]}" -eq 1 || { echo "::error::erwarte genau ein .deb, habe ${#debs[@]}"; exit 1; }
          appimage="${appimages[0]}"
          deb="${debs[0]}"
          # Dateiname traegt Version, ein eindeutiges OS+Geraet-Tag (#584: kein
          # rohes "arm64", das Linux/Raspi und macOS gleichermassen meinen
          # koennte) und den KI-Bündelstatus.
          ai_suffix=""
          [ "$WITH_AI" = "1" ] && ai_suffix="-ai"
          expected_appimage="BgRemover-${project_version}-${{ matrix.platform_tag }}${ai_suffix}.AppImage"
          test "$(basename "$appimage")" = "$expected_appimage" \
            || { echo "::error::AppImage-Name '$(basename "$appimage")' != '$expected_appimage'"; exit 1; }
          expected_deb="BgRemover-${project_version}-${{ matrix.platform_tag }}${ai_suffix}.deb"
          test "$(basename "$deb")" = "$expected_deb" \
            || { echo "::error::.deb-Name '$(basename "$deb")' != '$expected_deb'"; exit 1; }
          # AppImage ist ausfuehrbar.
          test -x "$appimage" || { echo "::error::AppImage ist nicht ausfuehrbar"; exit 1; }
          # Debian-Metadaten lesbar und plausibel.
          dpkg-deb --info "$deb" >/dev/null
          test "$(dpkg-deb --field "$deb" Package)" = "bgremover"
          test "$(dpkg-deb --field "$deb" Version)" = "$project_version"
          test "$(dpkg-deb --field "$deb" Architecture)" = "${{ matrix.deb_arch }}"
          echo "Artefakte verifiziert: $(basename "$appimage"), $(basename "$deb")"

      # Qt-Laufzeitbibliotheken für den offscreen-Smoke-Launch des AppImage.
      # Das python-appimage bündelt CPython + PyQt6, aber das offscreen-Plugin
      # linkt System-libGL/-libEGL/Fontconfig/xkbcommon/D-Bus; ohne sie scheitert
      # der Start mit ``libGL.so.1: cannot open shared object file``. Bewusst nur
      # die offscreen-relevante Teilmenge der Qt-Lib-Liste (keine xcb-Familie –
      # die braucht nur die xcb-Plattform), daher kein N6-Drift-Bezug.
      - name: Install Qt runtime libs for the offscreen smoke launch
        if: matrix.os == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libegl1 libgl1 libfontconfig1 libxkbcommon0 libdbus-1-3

      # #307: das frisch gebaute AppImage headless starten (offscreen +
      # BGREMOVER_SMOKE_TEST) und über den Watchdog auf Start-Crash (#304),
      # Fork-Bomb (#305) und Nicht-Terminieren prüfen. #308: im --ai-Build
      # zusätzlich den KI-Selbsttest über den Spawn-Kindprozess fahren (rembg-
      # Kette inkl. pymatting-Metadaten importierbar). Schlägt einer fehl, fällt
      # der Kandidatenlauf; eine spätere Abnahme/Veröffentlichung wird blockiert.
      # Der Selbsttest läuft seit #595 ebenfalls über den smoke_launch.py-
      # Wächter (nicht nur roh im Vordergrund): ein manueller Raspberry-Pi-Test
      # deckte auf, dass der AppRun-Fix (#595) diesen Pfad im gepackten
      # AppImage-Kontext zum ersten Mal wirklich erreicht – zuvor verdeckte der
      # kaputte AppRun-Passthrough jeden Fehler dort. Ohne eigenen Wächter kann
      # ein hängender Spawn-Kindprozess (z. B. multiprocessing im
      # --appimage-extract-and-run-Mount) den Job stundenlang blockieren statt
      # sauber fehlzuschlagen (real beobachtet: 37 Minuten bis zum erzwungenen
      # Abbruch). Ursache: python-appimage setzt ``sys.executable`` auf das
      # äußere AppImage; multiprocessing startete damit jedes Spawn-Kind als
      # vollständige App neu. Der KI-Prozess wählt nun gezielt den eingebetteten
      # Python-Wrapper (#633). Der Wächter bleibt als Defense-in-Depth aktiv.
      - name: Smoke-launch built AppImage (headless, fork-bomb guard)
        if: matrix.os == 'linux'
        run: |
          set -euo pipefail
          # ABSOLUTER Pfad: der Waechter startet das Artefakt unten mit einem
          # anderen Arbeitsverzeichnis (--workdir). Ein relativer ``dist/...``-
          # Pfad wuerde dann gegen dieses leere Verzeichnis aufgeloest und der
          # Start mit FileNotFoundError abbrechen – auch im KI-Selbsttest, wo
          # ``env`` das Artefakt seinerseits relativ zu seinem cwd exect.
          appimage="$(ls -1 "$PWD"/dist/*.AppImage | head -1)"
          # Neutrales Arbeitsverzeichnis (#740): der AppRun-Entrypoint startet
          # die App als ``python -m bgremover``, und CPython stellt bei ``-m``
          # das cwd an den Anfang von ``sys.path``. Im Workspace liegt der
          # Checkout mit einem ``bgremover/``-Paket – ohne Wechsel prueft
          # dieser Smoke den Checkout statt des gebauten Bundles.
          neutral="$(mktemp -d)"
          # #920: dieselbe Ausgabe zusaetzlich als Phasen-Log mitschreiben. Der
          # Sicherheitsscan unten gleicht sie gegen das Register bekannter
          # Build-Anomalien ab; ``pipefail`` (oben gesetzt) haelt den
          # Exit-Status des Waechters, ``tee`` veraendert die Bewertung nicht.
          mkdir -p build-logs
          phase_log="build-logs/smoke-launch-appimage.log"
          : > "$phase_log"
          max_instances=1
          if [ "$WITH_AI" = "1" ]; then
            max_instances=5   # GUI + KI-Warmup-Kind (+ mp-Resource-Tracker)
            echo ">> KI-Selbsttest (#308): rembg-Kette im Spawn-Kindprozess importierbar?"
            python3 scripts/smoke_launch.py \
              --match "$(basename "$appimage")" \
              --max-instances "$max_instances" \
              --timeout 120 \
              --workdir "$neutral" \
              -- env BGREMOVER_AI_SELFCHECK=1 \
                 "$appimage" --appimage-extract-and-run 2>&1 | tee -a "$phase_log"
          fi
          python3 scripts/smoke_launch.py \
            --match "$(basename "$appimage")" \
            --max-instances "$max_instances" \
            --timeout 120 \
            --workdir "$neutral" \
            -- "$appimage" --appimage-extract-and-run 2>&1 | tee -a "$phase_log"

      # #584 (Codex-Review auf PR #608): "Verify built Linux artifacts" prueft
      # nur dpkg-deb-Metadaten (--info/--field) – kein echter System-Install.
      # Das Kandidaten-Gate-Dokument hatte einen echten dpkg-Installationszyklus
      # behauptet, obwohl der lokal nur mit einer Platzhalter-Payload
      # nachgebaut wurde; das tatsaechliche CI-Artefakt blieb ungetestet, ein
      # kaputtes reales .deb haette so trotzdem ein gruenes Gate passieren
      # koennen. Hier laeuft der echte Zyklus nativ (Job laeuft bereits auf dem
      # x86_64- bzw. aarch64-Runner) gegen genau das gebaute Artefakt: Install
      # ueber apt (loest "Depends: libfuse2|libfuse2t64" aus den Runner-Repos
      # auf), ein echter Start des installierten AppImage (derselbe Fork-Bomb-/
      # Haenger-Waechter wie oben), Remove, und die Abwesenheit aller
      # installierten Dateien danach.
      - name: Real .deb install/start/remove smoke (native architecture)
        if: matrix.os == 'linux'
        run: |
          set -euo pipefail
          deb="$(ls -1 dist/*.deb | head -1)"
          installed_appimage="/opt/BgRemover/BgRemover.AppImage"
          desktop_file="/usr/share/applications/de.bgremover.app.desktop"
          icon_file="/usr/share/icons/hicolor/512x512/apps/de.bgremover.app.png"

          sudo apt-get install -y "./$deb"
          test -x "$installed_appimage" \
            || { echo "::error::AppImage nach Install nicht unter $installed_appimage"; exit 1; }
          test -f "$desktop_file" || { echo "::error::Desktop-Launcher fehlt nach Install"; exit 1; }
          test -f "$icon_file" || { echo "::error::Icon fehlt nach Install"; exit 1; }

          max_instances=1
          [ "$WITH_AI" = "1" ] && max_instances=5
          # Neutrales cwd wie beim AppImage-Smoke oben (#740): der installierte
          # Entrypoint ist derselbe ``python -m bgremover``-Aufruf, also wuerde
          # auch hier der Checkout im Workspace das Bundle beschatten.
          neutral="$(mktemp -d)"
          mkdir -p build-logs   # #920, siehe Kommentar am AppImage-Smoke oben
          phase_log="build-logs/deb-install-smoke.log"
          : > "$phase_log"
          python3 scripts/smoke_launch.py \
            --match "BgRemover.AppImage" \
            --max-instances "$max_instances" \
            --timeout 120 \
            --workdir "$neutral" \
            -- "$installed_appimage" --appimage-extract-and-run 2>&1 | tee -a "$phase_log"

          sudo dpkg -r bgremover
          test ! -e "$installed_appimage" \
            || { echo "::error::AppImage nach dpkg -r weiterhin vorhanden"; exit 1; }
          test ! -e "$desktop_file" \
            || { echo "::error::Desktop-Launcher nach dpkg -r weiterhin vorhanden"; exit 1; }
          echo "OK: echter apt-Install/Start/dpkg-Remove-Zyklus fuer $(basename "$deb") erfolgreich."

      # ── macOS: .app + .dmg ──────────────────────────────────────────────
      - name: Build macOS app + .dmg (PyInstaller)
        if: matrix.os == 'macos'
        run: ./packaging/mac/build_macos.sh ${{ inputs.with_ai && '--ai' || '' }}

      # #709-Review: analog zum Linux-Leg – build_macos.sh installiert
      # PyInstaller unversioniert (``--upgrade``) in eine isolierte
      # ``toolenv``-venv; die venv bleibt nach dem Build erhalten.
      - name: Log actual PyInstaller bundler version (macOS)
        if: matrix.os == 'macos'
        run: |
          set -euo pipefail
          toolenv="build/macos/toolenv"
          echo ">> Tatsaechlich verwendete Bundler-Version (aus $toolenv):"
          "$toolenv/bin/pip" show pyinstaller | grep -E '^(Name|Version):'

      - name: Collect macOS artifact
        if: matrix.os == 'macos'
        run: |
          mkdir -p dist
          cp build/macos/*.dmg dist/
          ls -lh dist/
          # #584: SHA-256 je Artefakt fuer die Kandidaten-Gate-Doku direkt im
          # Job-Log sichtbar machen (kein zusaetzlicher Download noetig).
          shasum -a 256 dist/*

      # Reihenfolge (#920): Verifikation und Smoke-Launch des macOS-Bundles
      # stehen - wie im Linux-Leg - VOR dem Sicherheitsscan. Nur so liegt ihr
      # Phasen-Log bereits vor, wenn der Scanner es gegen das Register
      # bekannter Build-Anomalien haelt; zuvor lief der Scan dazwischen und
      # der macOS-Smoke war fuer die Anomalie-Durchsicht unsichtbar.
      - name: Verify built macOS artifact
        if: matrix.os == 'macos'
        run: |
          set -euo pipefail
          shopt -s nullglob
          project_version="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          dmgs=(dist/*.dmg)
          test "${#dmgs[@]}" -eq 1 || { echo "::error::erwarte genau ein .dmg, habe ${#dmgs[@]}"; exit 1; }
          dmg="${dmgs[0]}"
          ai_suffix=""
          [ "$WITH_AI" = "1" ] && ai_suffix="-ai"
          expected_dmg="BgRemover-${project_version}-${{ matrix.platform_tag }}${ai_suffix}.dmg"
          test "$(basename "$dmg")" = "$expected_dmg" \
            || { echo "::error::DMG-Name '$(basename "$dmg")' != '$expected_dmg'"; exit 1; }
          hdiutil imageinfo "$dmg" >/dev/null
          echo "macOS-Artefakt verifiziert: $(basename "$dmg")"

      # #307: das gebaute BgRemover.app headless starten (offscreen +
      # BGREMOVER_SMOKE_TEST) und über den Watchdog auf Start-Crash (#304) und
      # Fork-Bomb (#305) prüfen. Die macOS-.dmg war der ursprüngliche Fork-Bomb-
      # Vektor (fehlendes freeze_support → spawn relauncht die GUI). #308: im
      # --ai-Build zusätzlich den KI-Selbsttest fahren. Fällt einer durch, fällt
      # der Kandidatenlauf; eine spätere Abnahme/Veröffentlichung wird blockiert.
      - name: Smoke-launch built macOS app (headless, fork-bomb guard)
        if: matrix.os == 'macos'
        run: |
          set -euo pipefail
          app_bin="build/macos/dist/BgRemover.app/Contents/MacOS/BgRemover"
          test -x "$app_bin" || { echo "::error::App-Binary fehlt: $app_bin"; exit 1; }
          mkdir -p build-logs   # #920, siehe Kommentar am AppImage-Smoke oben
          phase_log="build-logs/smoke-launch-macos-app.log"
          : > "$phase_log"
          max_instances=1
          if [ "$WITH_AI" = "1" ]; then
            max_instances=5   # GUI + KI-Warmup-Kind (+ mp-Resource-Tracker)
            echo ">> KI-Selbsttest (#308): rembg-Kette im Spawn-Kindprozess importierbar?"
            # Wie im Linux-Leg (#595): über den smoke_launch.py-Wächter statt
            # roh im Vordergrund, damit ein hängender Selbsttest den Job nicht
            # unbegrenzt blockiert.
            python3 scripts/smoke_launch.py \
              --match "Contents/MacOS/BgRemover" \
              --max-instances "$max_instances" \
              --timeout 120 \
              -- env BGREMOVER_AI_SELFCHECK=1 "$app_bin" 2>&1 | tee -a "$phase_log"
          fi
          python3 scripts/smoke_launch.py \
            --match "Contents/MacOS/BgRemover" \
            --max-instances "$max_instances" \
            --timeout 120 \
            -- "$app_bin" 2>&1 | tee -a "$phase_log"

      # #584/#731: Kein Artefakt darf Secrets, Entwicklerpfade oder bekannte
      # Malware enthalten. Der gemeinsame Scanner entpackt AppImage, die im
      # .deb gewrappte AppImage und DMG; ClamAV prueft je Artefakt sowohl die
      # Rohdatei als auch diesen entpackten Inhalt. Ein reines ``clamscan dist``
      # hatte in den Laeufen 31751909210/31812097011 wegen der Standardlimits
      # trotz Exit 0 jeweils ``Data scanned: 0 B`` gemeldet. Deshalb erzwingt
      # das Skript jetzt EICAR-Erkennung, mehr als 0 gescannte Bytes und einen
      # harten Fehler bei jeder Limitueberschreitung. ClamAV statt eines
      # Marketplace-Actions, damit kein Drittanbieter-Code mit Repo-Zugriff
      # laeuft.
      #
      # #731 (ADR docs/history/ADR-2026-clamav-signaturcache.md): dieser Job
      # ruft freshclam NICHT mehr live auf. Die fruehere Annahme, alle drei
      # Matrix-Legs scheiterten am selben instabilen oeffentlichen Mirror
      # ("NULL X509 store" bei #725), war eine Falschdiagnose - real waren es
      # zwei getrennte Ursachen: Linux scheiterte an einem Log-/PID-Lock des
      # bereits laufenden clamav-freshclam-Systemdienstes (kein Mirror-
      # Problem), nur macOS traf tatsaechlich ein TLS-/X509-Problem beim
      # Live-Abruf. Die Signaturdatenbank wird stattdessen wöchentlich von
      # einem eigenen Workflow (clamav-db-refresh.yml) auf einem einzelnen
      # Linux-Runner geholt und in einem rotierenden, unveraenderlichen Cache
      # abgelegt - das macht die Datenbank (plattformunabhaengige, signierte
      # Binaerdaten) fuer alle drei Legs gleichermassen verfuegbar, ohne dass
      # macOS je selbst freshclam aufruft. Ein Cache-Miss (Seed-Job noch nie
      # gelaufen oder durch GitHubs 7-Tage-Leerlauf-Eviction entfernt) ist
      # weiterhin bewusst nicht blockierend (analog zur fail-safe Vision-
      # Vorbewertung in release-abnahme.yml und zu Kriterium MALWARE-01):
      # sichtbare Warnung, Scan wird uebersprungen. Ein tatsaechlicher Fund
      # bei vorhandener Datenbank blockiert weiterhin hart (clamscan liefert
      # exit code 1).
      - name: Install ClamAV (Linux)
        if: matrix.os == 'linux'
        run: sudo apt-get install -y clamav

      # #731 (Codex-Review auf PR #779): apt startet automatisch einen
      # clamav-freshclam-Systemdienst; der Kandidatenbau soll aber nie selbst
      # live nachladen (das macht seitdem ausschliesslich der Seed-Workflow).
      # Dienst konsequent stoppen, analog zum Seed-Job selbst - unabhaengig
      # davon liest der Scan unten ohnehin nur die eigene Cache-Kopie und
      # nie ``/var/lib/clamav``, der Dienst kann also auch bei einem
      # verpassten Stop keine falsche Evidenz mehr erzeugen.
      - name: Stop auto-started freshclam service (Linux)
        if: matrix.os == 'linux'
        run: |
          sudo systemctl stop clamav-freshclam.service clamav-freshclam.timer 2>/dev/null || true

      - name: Install ClamAV (macOS)
        if: matrix.os == 'macos'
        run: brew install clamav

      # Praefix-Restore statt exakter Key (#731): der Seed-Workflow erzeugt
      # bei jedem Lauf einen neuen, niemals wiederverwendeten Key (Actions-
      # Caches sind unveraenderlich); die primaere ``key`` hier trifft daher
      # absichtlich nie, ``restore-keys`` liefert stattdessen den zuletzt
      # erzeugten Cache-Eintrag mit diesem Praefix zurueck.
      - name: Restore ClamAV signature database (rotating cache)
        uses: actions/cache/restore@v5
        with:
          path: clamav-db-cache
          key: clamav-db-v1-none-such-key
          restore-keys: |
            clamav-db-v1-

      - name: Scan built artifacts and extracted payloads (secrets + ClamAV)
        run: |
          set -euo pipefail
          # Gemeinsame Argumente beider Zweige (#920): maschinenlesbarer
          # Bericht, Job-Summary, Register bekannter Build-Anomalien und die
          # Phasen-Logs der Smoke-Schritte. Der Bericht entsteht in JEDEM Fall,
          # auch bei hartem Befund - er ist die Evidenz fuer Runbook-Schritt 4.
          common=(
            --report security-scan/security-scan-report.json
            --summary security-scan/security-scan-summary.md
            --anomaly-register release/build-anomalies.json
            --platform "${{ matrix.platform_tag }}"
            --build-log-dir build-logs
          )
          if [ -z "$(ls -A clamav-db-cache 2>/dev/null)" ]; then
            # Der deterministische Secret-/Pfad-Scan bleibt auch bei fehlendem
            # Signaturcache verbindlich. Nur MALWARE-01 wird gemaess Checkliste
            # sichtbar UNAVAILABLE und benoetigt die dokumentierte Entscheidung.
            # Die Warnung schreibt seit #920 der Scanner selbst, damit derselbe
            # Grund im Bericht und im Joblog steht. Der Grund nennt bewusst NUR
            # die fehlende Datenbank: ob der Secret-/Pfad-Scan besteht, steht
            # erst nach ihm fest und sagt allein das Verdikt des Berichts.
            python3 scripts/scan_release_artifacts.py "${common[@]}" \
              --malware-unavailable "kein Cache-Treffer – clamav-db-refresh.yml lief noch nie erfolgreich oder der Cache wurde eviktiert." \
              dist
            exit 0
          fi

          # --database zeigt clamscan explizit auf die restaurierte
          # Cache-Kopie (#731, Codex-Review auf PR #779): ClamAVs/Homebrews
          # konfigurierter Standardpfad unterscheidet sich je Plattform und
          # Formel-Version (Homebrew nutzt ``var/lib/clamav``, nicht
          # ``share/clamav``) - der explizite Pfad braucht keinen Bezug
          # darauf und keine OS-spezifische Kopie in einen Systempfad mehr.
          # Engine-/Signaturzeile und Frische-Check liest seit #920 der Scanner
          # (``clamav_signature_state``) statt eines eingebetteten Heredocs -
          # dieselbe Auswertung, aber getestet und im Bericht hinterlegt.
          python3 scripts/scan_release_artifacts.py "${common[@]}" \
            --clamav-database clamav-db-cache dist

      # Der Scan oben laeuft nur bei Erfolg (implizites ``success()``). Faellt
      # vorher ein Build- oder Smoke-Schritt, gibt es keinen Bericht - obwohl
      # die Phasen-Logs dann vorliegen und die Anomalie-Durchsicht gerade dort
      # gebraucht wird (der erste Registereintrag betrifft genau einen
      # Smoke-Schritt). Deshalb der Nachtrag im Logs-only-Modus.
      #
      # Bewusst NICHT ``if: always()`` am Scan selbst: bei gefallenem Build ist
      # ``dist/`` leer, der Scanner bricht dann fail-closed mit Exit 1 ab und
      # schreibt gar keinen Bericht - das gaebe einen zweiten roten Schritt
      # ohne Evidenzgewinn. Und ein leeres ``dist/`` muss bei gruenem Build ein
      # harter Fehler bleiben.
      - name: Anomalie-Durchsicht der Phasen-Logs nachtragen (nur im Fehlerfall)
        if: failure()
        run: |
          set -euo pipefail
          # Ist der Scan selbst gefallen (echter Befund), liegt sein Bericht
          # bereits vor. Der Nachtrag darf ihn niemals ueberschreiben.
          if [ -f security-scan/security-scan-report.json ]; then
            echo "::notice::Sicherheitsbericht liegt bereits vor – kein Nachtrag noetig."
            exit 0
          fi
          python3 scripts/scan_release_artifacts.py --logs-only \
            --report security-scan/security-scan-report.json \
            --summary security-scan/security-scan-summary.md \
            --anomaly-register release/build-anomalies.json \
            --platform "${{ matrix.platform_tag }}" \
            --build-log-dir build-logs

      # Bericht und Summary auch im Fehlerfall sichern: gerade ein FAIL ist die
      # Evidenz, die der Security-Owner in Runbook-Schritt 4 braucht (#920).
      - name: Render security scan summary
        if: always()
        run: |
          set -euo pipefail
          if [ -f security-scan/security-scan-summary.md ]; then
            cat security-scan/security-scan-summary.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::Kein Sicherheitsbericht erzeugt – der Scan-Schritt brach vor dem Schreiben ab."
          fi

      - name: Upload security scan report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: security-scan-${{ matrix.platform_tag }}
          path: |
            security-scan/
            build-logs/
          if-no-files-found: warn
          retention-days: 90

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v7
        with:
          name: bgremover-${{ matrix.platform_tag }}
          path: dist/*
          if-no-files-found: error
          retention-days: 90
