name: Claude Code Review

# Automatisches Code-Review durch Claude bei jedem geöffneten/aktualisierten
# Pull Request. Realisiert den "Code Review Agent" aus .github/agents/
# code-review.yml. Bewertet nur (Kommentare/Review) und schreibt keinen Code.
# Der Job selbst ist kein Required Check; ein Inline-Befund kann den Merge aber
# bis zur Auflösung der Review-Konversation sperren. Das CI-Gate kommt aus
# pr-ci.yml.
#
# Voraussetzung: Repo-Secret CLAUDE_CODE_OAUTH_TOKEN (lokal erzeugt mit
# `claude setup-token`; rechnet über das Claude-Abo statt über eine
# API-Abrechnung). Ohne Secret wird das Review sauber übersprungen (kein
# roter Lauf).

on:
  pull_request:
    types: [opened, synchronize]

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
      actions: read  # Damit Claude die CI-Ergebnisse des PR lesen kann.
    env:
      HAS_CLAUDE_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          # Der Agent selbst darf keine Historie nachladen. Der kontrollierte
          # Checkout stellt deshalb Merge-Eltern und Historie vorab bereit, damit
          # die unten exakt freigegebenen Git-Leseformen belastbare Daten sehen.
          fetch-depth: 0

      - name: Hinweis bei fehlendem Secret
        if: env.HAS_CLAUDE_TOKEN != 'true'
        run: |
          echo "::warning::CLAUDE_CODE_OAUTH_TOKEN ist nicht gesetzt – Review \
          übersprungen. Token lokal mit 'claude setup-token' erzeugen und unter \
          Settings → Secrets and variables → Actions ergänzen."

      - name: Claude Review
        id: claude
        if: env.HAS_CLAUDE_TOKEN == 'true'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Standard-GITHUB_TOKEN statt der Claude-GitHub-App verwenden – so
          # genügt das Abo-Token als einziges Secret (keine App-Installation
          # nötig).
          github_token: ${{ secrets.GITHUB_TOKEN }}
          use_sticky_comment: true
          # Automation-/Prompt-Modus (kein track_progress → kein Tag-Modus mit
          # Schreib-/Git-Fähigkeiten). Die Allowlist erlaubt ausschließlich
          # Lesen und Kommentieren – Edit/Write sowie schreibende Git-Kommandos
          # sind nicht enthalten, das Review kann also keinen Code
          # committen/pushen (zusätzlich ist
          # contents auf read beschränkt).
          # WebFetch ist auf Doku-/Quell-Hosts begrenzt (PR #825): Ohne den
          # Zugriff schlug das Review Action-Inputs nicht nach, sondern riet –
          # und meldete die Vermutung als Blocker. `raw.githubusercontent.com`
          # ist dabei bewusst breit (jedes öffentliche Repo). Tragend ist dabei
          # nicht "nur lesen" – geholter Fremdinhalt fließt in einen Agenten mit
          # `pull-requests: write`, also die klassische Prompt-Injection-Kante.
          # Tragend ist der Trigger: `on: pull_request` reicht Forks keine
          # Secrets durch, `HAS_CLAUDE_TOKEN` bleibt dort leer und der Job
          # überspringt sich. Ein Wechsel auf `pull_request_target` würde genau
          # diese Absicherung aufheben.
          prompt: |
            Reviewe diesen Pull Request für das Projekt BgRemover (PyQt6-Desktop-App,
            Python >= 3.10). Gib fokussiertes, umsetzbares Feedback – bevorzugt als
            inline-Kommentare an den betroffenen Stellen, ergänzt um eine kurze
            Zusammenfassung. Wenn nichts Wesentliches auffällt, sag das klar.

            Prüfe insbesondere:
            - **Korrektheit & Edge Cases** (Image-Ops, Height-Map, Qt-UI, Worker/
              Race-Conditions, Undo/Redo-Speicher).
            - **Projektstandards:** Das maßgebliche Gate ist `make check`
              (ruff line-length 100 / Regeln E,F,W,I,B,UP,SIM; mypy; pytest mit
              QT_QPA_PLATFORM=offscreen). Coverage-Baseline `make coverage` >= 86.
            - **Konventionen:** Kommentare/Docstrings auf Deutsch, Code-Identifier
              englisch; den bestehenden kompakten Stil treffen.
            - **Drift-Disziplin (Befund N6):** Die Qt-apt-Paketliste muss in sechs
              Dateien identisch bleiben (ci.yml, pr-ci.yml, ui-nightly.yml,
              benchmark.yml, coverage.yml, .claude/hooks/session-start.sh).
            - **Sicherheit & Performance** relevanter Änderungen.

            Kontext steht in CLAUDE.md. Wiederhole nicht, was die CI-Checks ohnehin
            abfangen – ergänze menschlich wertvolles Review. Nutze zum Setzen von
            Zeilen-Kommentaren das Inline-Comment-Werkzeug; die Zusammenfassung
            landet im (Sticky-)PR-Kommentar.

            Arbeite ausschließlich bewertend und lasse den Checkout unverändert.
            Grundlage sind der PR-Diff, die bereits ausgecheckten Dateien, die
            vorhandenen Git-Referenzen und die von GitHub gemeldeten CI-Ergebnisse.
            Erlaubt sind nur die freigegebenen Leseabfragen; nutze pro Bash-Aufruf
            genau ein solches Kommando und für Text-/Dateisuche Read, Grep oder Glob.

            Nutze für Inhaltsänderungen `gh pr diff`. Wenn Git-Metadaten nötig sind,
            verwende **nur** eine der folgenden exakten Formen – ohne weitere Flags,
            Pfade, Umleitungen, Pipes oder Verkettungen:
            - `git status --short`
            - `git show-ref --head`
            - `git log --oneline --decorate --max-count=30 HEAD`
            - `git diff --stat HEAD^ HEAD`
            - `git diff --name-only HEAD^ HEAD`
            - `git show --stat --oneline HEAD`
            - `git show --format=fuller --no-patch HEAD`

            Versuche insbesondere **nicht**, Git-Historie nachzuladen (`git fetch`),
            Tests oder PR-Code lokal auszuführen, generische `gh api`-Umwege zu
            verwenden oder den Arbeitsbaum zu verändern (`git checkout`/`restore`,
            `cp`, `mv`, Edit/Write, Commit oder Push). Wenn der vorhandene Checkout,
            Diff und CI-Stand eine Aussage nicht belegen, markiere sie als
            **unbelegt** und fahre mit dem Review fort.

            Recherche ist erwünscht, aber nicht um jeden Preis: Ist eine Quelle
            nicht abrufbar, weil Werkzeug oder Domain nicht freigegeben sind,
            notiere die Aussage als **unbelegt** und fahre fort. Suche keine
            Umwege über andere Werkzeuge – jeder abgelehnte Versuch kostet einen
            Turn. Poste deine Befunde rechtzeitig: Ein Lauf, der das Turn-Budget
            aufbraucht, bevor er kommentiert hat, ist wertlos.
          # Achtung: `claude_args` ist ein Block-Skalar – jede Zeile darin geht
          # als CLI-Argument an Claude Code. Erklärungen gehören deshalb hier
          # herauf, nicht zwischen die Argumente.
          # --model: Ohne die Zeile nimmt die Action ihren eigenen Default (er
          # hängt an der Kontoart; im ersten Lauf war das claude-sonnet-5). Für
          # ein Review auf diesem Codebestand ist das stärkere Modell die bessere
          # Wahl. Fest benannt statt Alias `opus` – dafür wandert die Zeile nicht
          # mit: Bei einem Modell-/Auth-Fehler im Review-Job zuerst hier schauen.
          # Nur-Lese-Freigaben (#841): `gh pr list` sowie `git show`, `diff`,
          # `log`, `status` und `show-ref` sind die in realen Fehlläufen belegten
          # Inspektionswege. Git erhält bewusst keine Präfix-Wildcards: `show`,
          # `diff` und `log` könnten sonst mit `--output` Dateien schreiben. Nur
          # die unten vollständig ausgeschriebenen Argumentformen sind erlaubt;
          # die Historie dafür kommt kontrolliert aus `actions/checkout`.
          # Bewusst nicht freigegeben sind `git fetch`, lokale Testausführung,
          # pauschales `gh api`, Edit/Write und alle Git-/Datei-Schreibbefehle.
          claude_args: |
            --max-turns 30
            --model claude-opus-5
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr list:*),Bash(gh pr comment:*),Bash(git status --short),Bash(git show-ref --head),Bash(git log --oneline --decorate --max-count=30 HEAD),Bash(git diff --stat HEAD^ HEAD),Bash(git diff --name-only HEAD^ HEAD),Bash(git show --stat --oneline HEAD),Bash(git show --format=fuller --no-patch HEAD),Read,Grep,Glob,WebFetch(domain:docs.claude.com),WebFetch(domain:code.claude.com),WebFetch(domain:platform.claude.com),WebFetch(domain:docs.anthropic.com),WebFetch(domain:docs.github.com),WebFetch(domain:raw.githubusercontent.com)"

      # Abgelehnte Werkzeugaufrufe sichtbar machen (#825). Statt der vollen
      # SDK-Ausgabe (`show_full_output`, weltlesbarer Joblog) wird gezielt nur
      # `permission_denials` aus dem Protokoll der Action gezogen. Zweimal war
      # genau das die entscheidende Information: Ein Agent, der eine Quelle
      # nicht abrufen darf, rät stillschweigend statt nachzuschlagen, und
      # abgelehnte Aufrufe verbrauchen zusätzlich Turns bis zum Budgetende.
      # Der Block ist in beiden Claude-Workflows wortgleich;
      # tests/test_claude_workflow_diagnostics.py hält ihn synchron.
      # `continue-on-error`: Die Diagnose darf einen sonst grünen Lauf nie rot
      # färben. Das Gating hängt am Schritt-Ergebnis statt am Output-Pfad –
      # bricht die Action früh ab (Auth, Nutzungslimit, Modell nicht gedeckt),
      # gibt es kein `execution_file`, und genau dann wird die Diagnose am
      # dringendsten gebraucht.
      - name: Abgelehnte Werkzeugaufrufe ausweisen
        if: always() && steps.claude.outcome != 'skipped'
        continue-on-error: true
        env:
          EXECUTION_FILE: ${{ steps.claude.outputs.execution_file }}
        run: |
          set -euo pipefail
          if [ ! -f "$EXECUTION_FILE" ]; then
            echo "Kein Protokoll unter '$EXECUTION_FILE' – nichts auszuwerten."
            exit 0
          fi
          # Ein jq-Fehler darf nicht als "0 Ablehnungen" durchgehen: Das wäre im
          # Log nicht vom sauberen Lauf zu unterscheiden – dieselbe Falle, die
          # CLAUDE.md für den ClamAV-Scan ausschließt ("ein still übersprungener
          # Scan gilt nie als bestanden"). Der Abschluss-Datensatz liegt je nach
          # Ausgabeform verschieden tief; die rekursive Suche findet ihn so oder so.
          if ! denials=$(jq -r '.. | objects | select(has("permission_denials"))
                                | .permission_denials[]?
                                | "\(.tool_name): \(.tool_input | tostring | .[0:300])"' \
            "$EXECUTION_FILE"); then
            echo "::warning::Protokoll nicht auswertbar – abgelehnte Aufrufe unbekannt."
            exit 0
          fi
          # Anzahl aus der Liste selbst zählen: `permission_denials_count` steht
          # in einem anderen Datensatz als `permission_denials`, ein Fallback
          # darauf meldete sonst "0" neben einer nicht leeren Liste.
          count=0
          if [ -n "$denials" ]; then
            count=$(printf '%s\n' "$denials" | wc -l | tr -d ' ')
          fi
          jq -r '.. | objects | select(has("num_turns"))
                 | "Lauf: \(.subtype // "?"), Turns: \(.num_turns)"' \
            "$EXECUTION_FILE" || true
          echo "Abgelehnte Aufrufe: $count"
          if [ "$count" -gt 0 ]; then
            printf '%s\n' "$denials"
          fi
