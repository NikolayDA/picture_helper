name: Release-Abnahme (Self-hosted Hardware)

# Sammelt die Release-Abnahme-Evidenz (Issue #595, Epic #639) auf Self-hosted
# Runnern echter Zielhardware. Betrieb: docs/RELEASE_AUTOMATION.md, Vertrag:
# docs/history/ADR-2026-release-abnahme-automatisierung.md.
#
# Sicherheitsmodell (verbindlich): ausschliesslich workflow_dispatch – nie
# push/pull_request/Fork; Least-Privilege-Permissions (nur Lesen); keine
# Secrets in den Smoke-Steps (persist-credentials: false, Dispatch-Inputs nur
# ueber env). Schreibrechte nur dort, wo sie unvermeidbar sind: der
# Issue-Kommentar im Aggregations-Job (#646) und der Run-Abbruch im
# Runner-Watchdog (#915).

run-name: >-
  Release-Abnahme ${{ inputs.platforms }}${{ inputs.dispatch_marker
  && format(' [{0}]', inputs.dispatch_marker) || '' }}

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: 'Run-ID eines erfolgreichen release-linux.yml-Kandidatenlaufs.'
        type: string
        required: true
      platforms:
        description: 'Zielplattformen'
        type: choice
        options:
          - alle
          - macos-arm64
          - linux-arm64
          - linux-x86_64
        default: alle
      dry_run:
        description: 'Nur Smokes, ohne Auswertung (Vision/Aggregation, #646)'
        type: boolean
        default: false
      target_issue:
        description: >-
          Issue fuer den Kommentar mit der Abschlussmatrix. Leer =
          ausdruecklich kein Kommentar (nur Artefakt und Job-Summary) - der
          automatisierte Dispatch aus dem Publish-Lauf reicht dessen eigenen,
          womoeglich leeren Wert durch (#919).
        type: string
        default: '595'
      predecessor_tag:
        description: >-
          Vorgaenger-Release-Tag (z. B. v2.9.0) fuer den echten
          UPDATE-LINUX-ARM-01-/UPDATE-MACOS-ARM-01-Nachweis (#748/#917) auf
          Linux arm64 und macOS arm64. macOS setzt einen Vorgaenger >= 2.7.3
          voraus (In-Prozess-Hook). Leer = Update-Check wird uebersprungen
          (bleibt PENDING statt fabriziert PASS).
        type: string
        default: ''
      dispatch_marker:
        description: >-
          Korrelationsmarker des ausloesenden Publish-Laufs (#919, Stufe 2).
          Er landet im run-name, weil workflow_dispatch keine Run-ID
          zurueckliefert - erst damit findet der Publish-Lauf den von ihm
          ausgeloesten Nachweislauf wieder. Leer = manueller Start.
        type: string
        default: ''
      publish_run_id:
        description: >-
          Run-ID des Publish-Laufs (#919, Stufe 3). Gesetzt = dieser Lauf
          zieht dessen Release-Instanz nach, ergaenzt die beiden
          Post-Release-Kriterien und validiert sie bis post-release.
          Leer = keine Instanzpflege.
        type: string
        default: ''

permissions:
  contents: read
  actions: read

concurrency:
  # Kein paralleler Abnahme-Lauf auf denselben Geraeten.
  group: release-abnahme
  cancel-in-progress: false

jobs:
  candidate-source:
    name: Kandidatenquelle und exakte Artefaktmenge
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      head_sha: ${{ steps.contract.outputs.head_sha }}
      version: ${{ steps.contract.outputs.version }}
      expected_tag: ${{ steps.contract.outputs.expected_tag }}
      contract_artifact_name: ${{ steps.artifact-name.outputs.name }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Build-Run-Metadaten unveraenderlich beziehen
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ inputs.run_id }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_RUN_ID" =~ ^[1-9][0-9]*$ ]] \
            || { echo "::error::run_id muss eine positive Ganzzahl sein."; exit 1; }
          mkdir -p "${RUNNER_TEMP}/candidate-metadata"
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_RUN_ID}" \
            > "${RUNNER_TEMP}/candidate-metadata/run.json"
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_RUN_ID}/artifacts?per_page=100" \
            > "${RUNNER_TEMP}/candidate-metadata/artifacts.json"
      - name: Genau die Kandidatenartefakte des Build-Runs laden
        uses: actions/download-artifact@v8
        with:
          pattern: bgremover-*
          path: ${{ runner.temp }}/candidate-files
          merge-multiple: true
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}
      - name: Freeze-Provenienz desselben Build-Runs laden
        uses: actions/download-artifact@v8
        with:
          pattern: release-freeze-provenance-*
          path: ${{ runner.temp }}/candidate-provenance
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}
      - name: Kandidatenvertrag pruefen und erzeugen
        id: contract
        env:
          SOURCE_RUN_ID: ${{ inputs.run_id }}
        run: |
          set -euo pipefail
          python3 scripts/release_contract.py prepare-candidate \
            --run-json "${RUNNER_TEMP}/candidate-metadata/run.json" \
            --artifacts-json "${RUNNER_TEMP}/candidate-metadata/artifacts.json" \
            --candidate-dir "${RUNNER_TEMP}/candidate-files" \
            --provenance-dir "${RUNNER_TEMP}/candidate-provenance" \
            --run-id "$SOURCE_RUN_ID" \
            --output-dir "${RUNNER_TEMP}/candidate-contract"
      - name: Abnahme-Workflow an exakt denselben Commit binden
        env:
          SOURCE_HEAD_SHA: ${{ steps.contract.outputs.head_sha }}
        run: |
          set -euo pipefail
          test "$SOURCE_HEAD_SHA" = "$GITHUB_SHA" || {
            echo "::error::Abnahme-Workflow laeuft auf $GITHUB_SHA, Kandidat ist $SOURCE_HEAD_SHA. Workflow auf exakt dem Kandidaten-Commit dispatchen."
            exit 1
          }
      - name: Attempt-spezifischen Vertragsnamen festlegen
        id: artifact-name
        run: echo "name=release-candidate-contract-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.artifact-name.outputs.name }}
          path: ${{ runner.temp }}/candidate-contract/
          if-no-files-found: error
          retention-days: 90

  # Preflight (#915): schneller Readiness-Nachweis je Zielplattform, BEVOR die
  # schweren Abnahme-Jobs starten. Prueft die realen Einsatzvoraussetzungen
  # (grafische Session, GL-Bibliothek, freier Speicher, python3+venv, Netz,
  # eng begrenztes sudo fuer den .deb-Zyklus) ohne venv-Installation –
  # Sekunden statt Minuten. Ersetzt den frueher noetigen manuellen Probelauf
  # vor der bindenden Abnahme. Der Runner-Watchdog unten bricht den Lauf ab,
  # wenn ein Preflight mangels Online-Runner in der Queue haengen bleibt.
  # Eine per Heartbeat-Eskalation ausgetragene Plattform (#958, Variable
  # RUNNER_<PLATTFORM>_RETIRED_SINCE) wird wie der pausierte x86_64-Pfad
  # uebersprungen – Preflight und Plattform-Job. Sonst wartete der Lauf auf
  # einen Runner, den es nicht mehr gibt, und der Watchdog braeche ihn ab,
  # bevor die Matrix die Austragung sichtbar machen kann.
  preflight-macos-arm64:
    name: Preflight macOS arm64
    if: >-
      (inputs.platforms == 'alle' || inputs.platforms == 'macos-arm64')
      && vars.RUNNER_MACOS_ARM64_RETIRED_SINCE == ''
    runs-on: [self-hosted, macOS, ARM64]
    # 10 statt 5 Minuten seit #934: Der echte Qt-/GL-Probeaufruf baut seine
    # schlanke Runtime einmal je Pin-Stand (Qt-Wheels ~100 MB). Danach kostet
    # der Aufruf Sekunden; das Budget ist die Obergrenze, nicht der Regelfall.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Einsatzbereitschaft pruefen
        run: python3 scripts/abnahme_preflight.py --platform macos-arm64

  preflight-linux-arm64:
    name: Preflight Linux aarch64
    if: >-
      (inputs.platforms == 'alle' || inputs.platforms == 'linux-arm64')
      && vars.RUNNER_LINUX_ARM64_RETIRED_SINCE == ''
    runs-on: [self-hosted, Linux, ARM64]
    # 10 statt 5 Minuten seit #934 (einmaliger Bau der Qt-Probe-Runtime).
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Einsatzbereitschaft pruefen
        run: python3 scripts/abnahme_preflight.py --platform linux-arm64

  preflight-linux-x86_64:
    name: Preflight Linux x86_64
    if: >-
      (inputs.platforms == 'alle' || inputs.platforms == 'linux-x86_64')
      && vars.ABNAHME_X86_64_ENABLED == 'true'
      && vars.RUNNER_LINUX_X86_64_RETIRED_SINCE == ''
    runs-on: [self-hosted, Linux, X64]
    # 10 statt 5 Minuten seit #934 (einmaliger Bau der Qt-Probe-Runtime).
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Einsatzbereitschaft pruefen
        run: python3 scripts/abnahme_preflight.py --platform linux-x86_64

  # Runner-Watchdog (#915): GitHub bricht Jobs ohne zugewiesenen Self-hosted-
  # Runner erst nach 24 h ab, und timeout-minutes zaehlt erst ab Jobstart –
  # gegen die Queue-Phase schuetzt es nicht (beobachtet: 7:58 h Warteschlange
  # in Lauf 33071408111, v2.9.0/#881). Dieser GitHub-hosted Job beendet den
  # Lauf deshalb selbst: Phase 1, wenn ein Preflight nach zehn Minuten noch
  # queued ist; Phase 2 (Codex-Review PR #924), wenn danach ein schwerer
  # Abnahme-Job nicht binnen 25 Minuten startet (die laengere Frist deckt die
  # candidate-source-Laufzeit ab, nach der er erst einplanbar wird).
  # Force-cancel statt cancel: ein regulaerer Cancel liesse !cancelled()-Jobs
  # (die Aggregation) weiterlaufen und erneut eine als Abnahmeergebnis lesbare
  # Matrix posten. Das Schreibrecht zum Run-Abbruch traegt im gesamten
  # Workflow NUR dieser Job; faellt die Beobachtung aus (API-Fehler), bricht
  # der Watchdog bewusst nichts ab (fail-safe, scripts/abnahme_watchdog.py).
  runner-watchdog:
    name: Runner-Watchdog (Queue-Abbruch)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Preflight-Queue ueberwachen
        env:
          GH_TOKEN: ${{ github.token }}
          PLATFORMS: ${{ inputs.platforms }}
          RETIRED_MACOS_ARM64: ${{ vars.RUNNER_MACOS_ARM64_RETIRED_SINCE }}
          RETIRED_LINUX_ARM64: ${{ vars.RUNNER_LINUX_ARM64_RETIRED_SINCE }}
          RETIRED_LINUX_X86_64: ${{ vars.RUNNER_LINUX_X86_64_RETIRED_SINCE }}
        run: |
          set -euo pipefail
          # Erwartete Preflight-Menge aus den Dispatch-Eingaben ableiten
          # (Review PR #924): eine direkt nach Laufstart unvollstaendige
          # Jobliste darf den Waechter nicht vorzeitig beenden. Ausgetragene
          # Plattformen (#958) sind uebersprungen und werden nicht erwartet.
          x86flag=""
          [ "${{ vars.ABNAHME_X86_64_ENABLED }}" = "true" ] && x86flag="--x86-64-enabled"
          python3 scripts/abnahme_watchdog.py \
            --repo "$GITHUB_REPOSITORY" \
            --run-id "$GITHUB_RUN_ID" \
            --platforms "$PLATFORMS" \
            --deadline-seconds 600 \
            --acceptance-deadline-seconds 1500 \
            --poll-seconds 20 \
            --retired-since "macos-arm64=${RETIRED_MACOS_ARM64:-}" \
            --retired-since "linux-arm64=${RETIRED_LINUX_ARM64:-}" \
            --retired-since "linux-x86_64=${RETIRED_LINUX_X86_64:-}" \
            $x86flag

  abnahme-macos-arm64:
    name: Abnahme macOS arm64
    needs: [candidate-source, preflight-macos-arm64]
    if: >-
      (inputs.platforms == 'alle' || inputs.platforms == 'macos-arm64')
      && vars.RUNNER_MACOS_ARM64_RETIRED_SINCE == ''
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 30
    steps:
      # persist-credentials: false – kein GITHUB_TOKEN in der Git-Config, waehrend
      # spaeter ein heruntergeladenes Artefakt ausgefuehrt wird (Smoke-Grenze).
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Grafische Runner-Session pruefen
        shell: bash
        run: |
          set -euo pipefail
          runner_user="$(id -un)"
          console_user="$(stat -f '%Su' /dev/console)"
          if [ "$runner_user" != "$console_user" ]; then
            echo "::error::Runner-Benutzer $runner_user ist nicht der angemeldete Konsolenbenutzer $console_user. Der Runner muss als LaunchAgent in dessen GUI-Sitzung laufen."
            exit 1
          fi
      - name: Abnahme-venv (PyQt6 fuer die Probes)
        run: |
          python3 -m venv "${RUNNER_TEMP}/abnahme-venv"
          "${RUNNER_TEMP}/abnahme-venv/bin/python" -m pip install --upgrade "pip>=26.1.2"
          "${RUNNER_TEMP}/abnahme-venv/bin/python" -m pip install \
            -e ".[test]" -c requirements/constraints.txt
      - name: Artefakte beziehen und Evidenz anlegen
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.run_id }}
          SOURCE_HEAD_SHA: ${{ needs.candidate-source.outputs.head_sha }}
        run: |
          set -euo pipefail
          "${RUNNER_TEMP}/abnahme-venv/bin/python" scripts/release_abnahme.py \
            --platform macos-arm64 --source-run-id "$RUN_ID" \
            --commit-sha "$SOURCE_HEAD_SHA" \
            --output "${RUNNER_TEMP}/abnahme-macos-arm64"
      # Spiegelbild des Linux-Schritts (#917): erst mit einem bezogenen
      # Vorgaenger-DMG kann der macOS-Kanal UPDATE-MACOS-ARM-01 real erbringen.
      # Der Bezug laeuft anonym ueber browser_download_url (release_abnahme.py),
      # ein versehentlich privates Release faellt dadurch auf.
      - name: 'Echten Vorgaenger-Release beziehen (UPDATE-MACOS-ARM-01, #917)'
        if: inputs.predecessor_tag != ''
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PREDECESSOR_TAG: ${{ inputs.predecessor_tag }}
          SOURCE_HEAD_SHA: ${{ needs.candidate-source.outputs.head_sha }}
        run: |
          set -euo pipefail
          "${RUNNER_TEMP}/abnahme-venv/bin/python" scripts/release_abnahme.py \
            --platform macos-arm64 --release-tag "$PREDECESSOR_TAG" \
            --commit-sha "$SOURCE_HEAD_SHA" \
            --output "${RUNNER_TEMP}/abnahme-macos-arm64-predecessor"
      - name: DMG-Smoke inkl. Retina-, nativem 3D- und Update-Check-Nachweis (#643/#648/#917)
        env:
          PREDECESSOR_TAG: ${{ inputs.predecessor_tag }}
          CANDIDATE_VERSION: ${{ needs.candidate-source.outputs.version }}
        run: |
          set -euo pipefail
          unset QT_QPA_PLATFORM
          # ${arr[@]+"${arr[@]}"} statt "${arr[@]}": In Bash < 4.4 gilt ein
          # leeres Array unter `set -u` als unbound variable. Das stock-Bash
          # von macOS ist 3.2.57, und der Regelfall ist genau das leere Array
          # (jeder Abnahmelauf ohne predecessor_tag) - der Smoke braeche dann
          # ab, bevor irgendein Nachweis entsteht (Review-Befund PR #926).
          predecessor_args=()
          if [ -n "${PREDECESSOR_TAG}" ]; then
            predecessor_args=(
              --predecessor-evidence-dir "${RUNNER_TEMP}/abnahme-macos-arm64-predecessor"
              --candidate-version "${CANDIDATE_VERSION}"
            )
          fi
          # devicePixelRatio des Hauptfensters ermitteln (nativer Qt-Kontext).
          scale="$("${RUNNER_TEMP}/abnahme-venv/bin/python" scripts/abnahme_scale_probe.py)"
          "${RUNNER_TEMP}/abnahme-venv/bin/python" scripts/abnahme_smoke.py \
            --platform macos-arm64 \
            --evidence-dir "${RUNNER_TEMP}/abnahme-macos-arm64" \
            --scale-factor "$scale" \
            ${predecessor_args[@]+"${predecessor_args[@]}"}
      - name: Native E2E-Regression inkl. 3D-Ready-Nachweis (#644)
        env:
          ABNAHME_EVIDENCE_DIR: ${{ runner.temp }}/abnahme-macos-arm64
          ABNAHME_PLATFORM: macos-arm64
          ABNAHME_REQUIRE_NATIVE_3D: '1'
        run: |
          set -euo pipefail
          unset QT_QPA_PLATFORM
          "${RUNNER_TEMP}/abnahme-venv/bin/python" -m pytest -q \
            tests/test_e2e_release_regression.py
      - name: Live-GL-Performance-Suite (#645)
        run: |
          set -euo pipefail
          unset QT_QPA_PLATFORM
          "${RUNNER_TEMP}/abnahme-venv/bin/python" scripts/benchmark.py run \
            --suite preview3d-live --require-gl --no-compare --iterations 3 \
            --platform macos-arm64 \
            --results-dir "${RUNNER_TEMP}/abnahme-macos-arm64/preview3d-live"
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: abnahme-macos-arm64-${{ github.run_attempt }}
          path: ${{ runner.temp }}/abnahme-macos-arm64/
          if-no-files-found: error
          retention-days: 90

  abnahme-linux-arm64:
    name: Abnahme Linux aarch64
    needs: [candidate-source, preflight-linux-arm64]
    if: >-
      (inputs.platforms == 'alle' || inputs.platforms == 'linux-arm64')
      && vars.RUNNER_LINUX_ARM64_RETIRED_SINCE == ''
    runs-on: [self-hosted, Linux, ARM64]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Grafische Runner-Session pruefen
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${DISPLAY:-}" ] && [ -z "${WAYLAND_DISPLAY:-}" ]; then
            echo "::error::Weder DISPLAY noch WAYLAND_DISPLAY ist gesetzt. Der Runner muss in der angemeldeten grafischen Sitzung laufen."
            exit 1
          fi
          if [ -n "${WAYLAND_DISPLAY:-}" ] && [ -z "${XDG_RUNTIME_DIR:-}" ]; then
            echo "::error::WAYLAND_DISPLAY ist gesetzt, aber XDG_RUNTIME_DIR fehlt."
            exit 1
          fi
      - name: Abnahme-venv (PyQt6 fuer die Probes)
        run: |
          python3 -m venv "${RUNNER_TEMP}/abnahme-venv"
          "${RUNNER_TEMP}/abnahme-venv/bin/python" -m pip install --upgrade "pip>=26.1.2"
          "${RUNNER_TEMP}/abnahme-venv/bin/python" -m pip install \
            -e ".[test]" -c requirements/constraints.txt
      - name: Artefakte beziehen und Evidenz anlegen
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.run_id }}
          SOURCE_HEAD_SHA: ${{ needs.candidate-source.outputs.head_sha }}
        run: |
          set -euo pipefail
          "${RUNNER_TEMP}/abnahme-venv/bin/python" scripts/release_abnahme.py \
            --platform linux-arm64 --source-run-id "$RUN_ID" \
            --commit-sha "$SOURCE_HEAD_SHA" \
            --output "${RUNNER_TEMP}/abnahme-linux-arm64"
      - name: 'Echten Vorgaenger-Release beziehen (UPDATE-LINUX-ARM-01, #748)'
        if: inputs.predecessor_tag != ''
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PREDECESSOR_TAG: ${{ inputs.predecessor_tag }}
          SOURCE_HEAD_SHA: ${{ needs.candidate-source.outputs.head_sha }}
        run: |
          set -euo pipefail
          "${RUNNER_TEMP}/abnahme-venv/bin/python" scripts/release_abnahme.py \
            --platform linux-arm64 --release-tag "$PREDECESSOR_TAG" \
            --commit-sha "$SOURCE_HEAD_SHA" \
            --output "${RUNNER_TEMP}/abnahme-linux-arm64-predecessor"
      - name: AppImage- und .deb-Smoke inkl. GL-Provenance, nativem 3D- und Update-Check-Nachweis (#642/#648/#748)
        env:
          PREDECESSOR_TAG: ${{ inputs.predecessor_tag }}
          CANDIDATE_VERSION: ${{ needs.candidate-source.outputs.version }}
        run: |
          set -euo pipefail
          unset QT_QPA_PLATFORM
          # ${arr[@]+"${arr[@]}"} statt "${arr[@]}": In Bash < 4.4 gilt ein
          # leeres Array unter `set -u` als unbound variable. Das stock-Bash
          # von macOS ist 3.2.57, und der Regelfall ist genau das leere Array
          # (jeder Abnahmelauf ohne predecessor_tag) - der Smoke braeche dann
          # ab, bevor irgendein Nachweis entsteht (Review-Befund PR #926).
          predecessor_args=()
          if [ -n "${PREDECESSOR_TAG}" ]; then
            predecessor_args=(
              --predecessor-evidence-dir "${RUNNER_TEMP}/abnahme-linux-arm64-predecessor"
              --candidate-version "${CANDIDATE_VERSION}"
            )
          fi
          "${RUNNER_TEMP}/abnahme-venv/bin/python" scripts/abnahme_smoke.py \
            --platform linux-arm64 \
            --evidence-dir "${RUNNER_TEMP}/abnahme-linux-arm64" \
            ${predecessor_args[@]+"${predecessor_args[@]}"}
      - name: Native E2E-Regression inkl. 3D-Ready-Nachweis (#644)
        env:
          ABNAHME_EVIDENCE_DIR: ${{ runner.temp }}/abnahme-linux-arm64
          ABNAHME_PLATFORM: linux-arm64
          ABNAHME_REQUIRE_NATIVE_3D: '1'
        run: |
          set -euo pipefail
          unset QT_QPA_PLATFORM
          "${RUNNER_TEMP}/abnahme-venv/bin/python" -m pytest -q \
            tests/test_e2e_release_regression.py
      - name: Live-GL-Performance-Suite (#645)
        run: |
          set -euo pipefail
          unset QT_QPA_PLATFORM
          "${RUNNER_TEMP}/abnahme-venv/bin/python" scripts/benchmark.py run \
            --suite preview3d-live --require-gl --no-compare --iterations 3 \
            --platform linux-arm64 \
            --results-dir "${RUNNER_TEMP}/abnahme-linux-arm64/preview3d-live"
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: abnahme-linux-arm64-${{ github.run_attempt }}
          path: ${{ runner.temp }}/abnahme-linux-arm64/
          if-no-files-found: error
          retention-days: 90

  # Linux x86_64 ist bis auf weiteres pausiert (kein GPU-Hardwarezugang,
  # Entscheidung 2026-07-20). Der Job bleibt vollstaendig definiert, laeuft aber
  # nur, wenn die Repository-Variable ABNAHME_X86_64_ENABLED == 'true' ist.
  # Reaktivierung ohne Code-Aenderung: siehe docs/RELEASE_AUTOMATION.md §5.
  abnahme-linux-x86_64:
    name: Abnahme Linux x86_64
    needs: [candidate-source, preflight-linux-x86_64]
    if: >-
      (inputs.platforms == 'alle' || inputs.platforms == 'linux-x86_64')
      && vars.ABNAHME_X86_64_ENABLED == 'true'
      && vars.RUNNER_LINUX_X86_64_RETIRED_SINCE == ''
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Grafische Runner-Session pruefen
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${DISPLAY:-}" ] && [ -z "${WAYLAND_DISPLAY:-}" ]; then
            echo "::error::Weder DISPLAY noch WAYLAND_DISPLAY ist gesetzt. Der Runner muss in der angemeldeten grafischen Sitzung laufen."
            exit 1
          fi
          if [ -n "${WAYLAND_DISPLAY:-}" ] && [ -z "${XDG_RUNTIME_DIR:-}" ]; then
            echo "::error::WAYLAND_DISPLAY ist gesetzt, aber XDG_RUNTIME_DIR fehlt."
            exit 1
          fi
      - name: Abnahme-venv (PyQt6 fuer die Probes)
        run: |
          python3 -m venv "${RUNNER_TEMP}/abnahme-venv"
          "${RUNNER_TEMP}/abnahme-venv/bin/python" -m pip install --upgrade "pip>=26.1.2"
          "${RUNNER_TEMP}/abnahme-venv/bin/python" -m pip install \
            -e ".[test]" -c requirements/constraints.txt
      - name: Artefakte beziehen und Evidenz anlegen
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.run_id }}
          SOURCE_HEAD_SHA: ${{ needs.candidate-source.outputs.head_sha }}
        run: |
          set -euo pipefail
          "${RUNNER_TEMP}/abnahme-venv/bin/python" scripts/release_abnahme.py \
            --platform linux-x86_64 --source-run-id "$RUN_ID" \
            --commit-sha "$SOURCE_HEAD_SHA" \
            --output "${RUNNER_TEMP}/abnahme-linux-x86_64"
      - name: AppImage- und .deb-Smoke inkl. GL-Provenance und nativem 3D-Nachweis (#642/#648)
        run: |
          set -euo pipefail
          unset QT_QPA_PLATFORM
          "${RUNNER_TEMP}/abnahme-venv/bin/python" scripts/abnahme_smoke.py \
            --platform linux-x86_64 \
            --evidence-dir "${RUNNER_TEMP}/abnahme-linux-x86_64"
      - name: Native E2E-Regression inkl. 3D-Ready-Nachweis (#644)
        env:
          ABNAHME_EVIDENCE_DIR: ${{ runner.temp }}/abnahme-linux-x86_64
          ABNAHME_PLATFORM: linux-x86_64
          ABNAHME_REQUIRE_NATIVE_3D: '1'
        run: |
          set -euo pipefail
          unset QT_QPA_PLATFORM
          "${RUNNER_TEMP}/abnahme-venv/bin/python" -m pytest -q \
            tests/test_e2e_release_regression.py
      - name: Live-GL-Performance-Suite (#645)
        run: |
          set -euo pipefail
          unset QT_QPA_PLATFORM
          "${RUNNER_TEMP}/abnahme-venv/bin/python" scripts/benchmark.py run \
            --suite preview3d-live --require-gl --no-compare --iterations 3 \
            --platform linux-x86_64 \
            --results-dir "${RUNNER_TEMP}/abnahme-linux-x86_64/preview3d-live"
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: abnahme-linux-x86_64-${{ github.run_attempt }}
          path: ${{ runner.temp }}/abnahme-linux-x86_64/
          if-no-files-found: error
          retention-days: 90

  # Sichtbarer Hinweis, wenn x86_64 pausiert ist – laeuft auf GitHub-hosted, weil
  # ein passender Self-hosted Runner gerade fehlen kann. So faellt der pausierte
  # Pfad nie still weg (ADR-Prinzip: pausiert, nicht erfuellt statt unsichtbar).
  hinweis-x86_64-pausiert:
    name: Hinweis Linux x86_64 pausiert
    if: >-
      (inputs.platforms == 'alle' || inputs.platforms == 'linux-x86_64')
      && vars.ABNAHME_X86_64_ENABLED != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Pause protokollieren
        run: |
          echo "::notice title=Linux x86_64 pausiert::Der x86_64-Hardware-Smoke ist pausiert (kein GPU-Zugang, Entscheidung 2026-07-20). Reaktivierung: docs/RELEASE_AUTOMATION.md §5 – ABNAHME_X86_64_ENABLED=true setzen."

  # Sichtbarer Hinweis, wenn eine Plattform per Heartbeat-Eskalation
  # ausgetragen ist (#958) – GitHub-hosted, weil der Runner gerade fehlt.
  # Dasselbe ADR-Prinzip wie beim pausierten x86_64-Pfad: ausgetragen, nicht
  # erfuellt statt unsichtbar. Die Abschlussmatrix fuehrt die Plattform
  # zusaetzlich als "ausgetragen seit <Datum>"; dieser Job traegt auch bei
  # dry_run, wo keine Matrix entsteht.
  hinweis-ausgetragen:
    name: Hinweis ausgetragene Plattform
    if: >-
      vars.RUNNER_MACOS_ARM64_RETIRED_SINCE != ''
      || vars.RUNNER_LINUX_ARM64_RETIRED_SINCE != ''
      || vars.RUNNER_LINUX_X86_64_RETIRED_SINCE != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      RETIRED_MACOS_ARM64: ${{ vars.RUNNER_MACOS_ARM64_RETIRED_SINCE }}
      RETIRED_LINUX_ARM64: ${{ vars.RUNNER_LINUX_ARM64_RETIRED_SINCE }}
      RETIRED_LINUX_X86_64: ${{ vars.RUNNER_LINUX_X86_64_RETIRED_SINCE }}
    steps:
      - name: Austragung protokollieren
        run: |
          set -euo pipefail
          for entry in "macos-arm64=${RETIRED_MACOS_ARM64:-}" "linux-arm64=${RETIRED_LINUX_ARM64:-}" "linux-x86_64=${RETIRED_LINUX_X86_64:-}"; do
            platform="${entry%%=*}"; since="${entry#*=}"
            [ -n "$since" ] || continue
            echo "::warning title=Plattform ausgetragen::${platform} ist seit ${since} aus dem erwarteten Bestand ausgetragen (Heartbeat-Eskalation Stufe 3, #958); Preflight und Abnahme-Job laufen nicht, die Freigabe bleibt blockiert. Reaktivierung: docs/RUNNER_SETUP.md §4."
          done

  # Aggregation: sammelt alle Evidenzen, bewertet Screenshots (Vision, fail-safe)
  # und postet die Abschlussmatrix als Kommentar. Schreibrechte NUR hier; die
  # Smoke-Jobs bleiben read-only (Sicherheitsmodell #640). Go/No-Go bleibt
  # menschlich (#646).
  aggregation:
    name: Abschlussmatrix
    needs: [candidate-source, abnahme-macos-arm64, abnahme-linux-arm64, abnahme-linux-x86_64]
    # !cancelled() statt always() (#915): Ein abgebrochener Lauf postet keine
    # als Abnahmeergebnis lesbare Matrix mehr (Lauf 33071408111 brauchte dafuer
    # eine manuelle Klarstellung im Release-Issue). Bei fehlgeschlagenen, aber
    # nicht abgebrochenen Plattform-Jobs laeuft die Aggregation weiter und
    # kennzeichnet die Matrix selbst als Diagnose (abnahme_aggregate.py).
    if: ${{ !cancelled() && !inputs.dry_run }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      # actions: read ist fuer den Artefaktbezug aus einem FREMDEN Lauf noetig
      # (Release-Instanz des Publish-Laufs, #919). Der Job-Block ersetzt die
      # Workflow-Permissions vollstaendig, der Wert muss hier also stehen.
      actions: read
      issues: write
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Evidenz-Artefakte herunterladen
        uses: actions/download-artifact@v7
        with:
          path: ${{ runner.temp }}/abnahme-evidenz
          pattern: abnahme-*
      - name: Kandidatenvertrag herunterladen
        uses: actions/download-artifact@v7
        with:
          name: ${{ needs.candidate-source.outputs.contract_artifact_name }}
          path: ${{ runner.temp }}/candidate-contract
      - name: Vision-SDK reproduzierbar installieren
        continue-on-error: true
        run: |
          set -euo pipefail
          python3 -m venv "${RUNNER_TEMP}/abnahme-vision-venv"
          "${RUNNER_TEMP}/abnahme-vision-venv/bin/python" -m pip install --upgrade \
            "pip>=26.1.2"
          "${RUNNER_TEMP}/abnahme-vision-venv/bin/python" -m pip install \
            "anthropic==0.117.0"
      - name: Screenshots vorbewerten (Vision, fail-safe)
        env:
          ANTHROPIC_VISION_API_KEY: ${{ secrets.ANTHROPIC_VISION_API_KEY }}
        run: |
          set -euo pipefail
          # Kein Key oder API-Fehler ⇒ jedes Kriterium 'unbewertet'; der
          # Lauf bricht nie ab (fail-safe, #646). Falls schon venv-Erzeugung
          # oder SDK-Installation scheiterte, übernimmt System-Python; das
          # Skript degradiert das fehlende SDK kontrolliert zu 'unbewertet'.
          vision_python=python3
          if [ -x "${RUNNER_TEMP}/abnahme-vision-venv/bin/python" ]; then
            vision_python="${RUNNER_TEMP}/abnahme-vision-venv/bin/python"
          fi
          "$vision_python" scripts/abnahme_vision_check.py \
            --screenshots-dir "${RUNNER_TEMP}/abnahme-evidenz" \
            --output "${RUNNER_TEMP}/abnahme-evidenz/vision-verdikte.json"
      - name: Vision-Verdikte als Actions-Artefakt sichern
        # if-no-files-found: warn statt error (#829, Befund 3): write_verdicts()
        # meldet einen Schreibfehler bewusst als Rueckgabewert statt zu werfen
        # (#819) - genau damit ein Ausgabefehler die Abnahme nicht abbricht
        # (abnahme_aggregate.load_vision behandelt eine fehlende Datei als
        # leere Verdiktliste). Mit "error" haette dieser Upload-Schritt den
        # Fail-safe-Vertrag eine Stufe spaeter wieder ausgehebelt: die Datei
        # fehlt, der Job bricht ab, Abschlussmatrix und Issue-Kommentar
        # entstehen nie. Der Fehlversuch bleibt trotzdem sichtbar, weil das
        # Skript ihn selbst als ::warning:: meldet.
        uses: actions/upload-artifact@v6
        with:
          name: vision-verdikte-${{ github.run_attempt }}
          path: ${{ runner.temp }}/abnahme-evidenz/vision-verdikte.json
          if-no-files-found: warn
          retention-days: 90
      - name: Abschlussmatrix erzeugen
        env:
          RETIRED_MACOS_ARM64: ${{ vars.RUNNER_MACOS_ARM64_RETIRED_SINCE }}
          RETIRED_LINUX_ARM64: ${{ vars.RUNNER_LINUX_ARM64_RETIRED_SINCE }}
          RETIRED_LINUX_X86_64: ${{ vars.RUNNER_LINUX_X86_64_RETIRED_SINCE }}
        run: |
          set -euo pipefail
          x86flag=""
          [ "${{ vars.ABNAHME_X86_64_ENABLED }}" = "true" ] && x86flag="--x86-64-enabled"
          # Ausgetragene Plattformen (#958) erscheinen als "ausgetragen seit
          # <Datum>" statt als stumme Luecke – sichtbar, kein Abnahmeergebnis.
          python3 scripts/abnahme_aggregate.py \
            --artifacts-dir "${RUNNER_TEMP}/abnahme-evidenz" \
            --output "${RUNNER_TEMP}/abschlussmatrix.md" \
            --summary-output "${RUNNER_TEMP}/acceptance-summary.json" \
            --commit-sha "${{ needs.candidate-source.outputs.head_sha }}" \
            --run-url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            --retired-since "macos-arm64=${RETIRED_MACOS_ARM64:-}" \
            --retired-since "linux-arm64=${RETIRED_LINUX_ARM64:-}" \
            --retired-since "linux-x86_64=${RETIRED_LINUX_X86_64:-}" \
            $x86flag
      - uses: actions/upload-artifact@v6
        with:
          name: abschlussmatrix-${{ github.run_attempt }}
          path: ${{ runner.temp }}/abschlussmatrix.md
          if-no-files-found: error
          retention-days: 90
      - name: Unveraenderliches Freigabemanifest erzeugen
        # Nur ein voller Drei-Plattform-Lauf (platforms=alle) darf ein
        # Freigabemanifest erzeugen - das verlangt zurecht macOS UND
        # Linux-arm64 als "approved" (siehe release_contract.py). Ein
        # bewusster Einzelplattform-Lauf (z. B. der Update-Nachlauf aus
        # Runbook-Schritt 9, #741) fehlt an genau dieser Vollstaendigkeit,
        # ist aber kein Fehlschlag, sondern ausserhalb des Vertrags dieses
        # Schritts - ohne dieses Gate schlug create-approval hier hart fehl
        # und liess den gesamten Lauf rot enden (Repro: Lauf 31833822560).
        if: inputs.platforms == 'alle'
        env:
          APPROVAL_ARTIFACT_NAME: release-approval-manifest-${{ github.run_attempt }}
          SOURCE_HEAD_SHA: ${{ needs.candidate-source.outputs.head_sha }}
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/release-approval"
          python3 scripts/release_contract.py create-approval \
            --candidate-contract "${RUNNER_TEMP}/candidate-contract/release-candidate-contract.json" \
            --evidence-dir "${RUNNER_TEMP}/abnahme-evidenz" \
            --checklist "docs/RELEASE_ACCEPTANCE_CHECKLIST.md" \
            --acceptance-summary "${RUNNER_TEMP}/acceptance-summary.json" \
            --acceptance-run-id "${GITHUB_RUN_ID}" \
            --acceptance-run-attempt "${GITHUB_RUN_ATTEMPT}" \
            --acceptance-head-sha "$SOURCE_HEAD_SHA" \
            --approval-artifact-name "$APPROVAL_ARTIFACT_NAME" \
            --output "${RUNNER_TEMP}/release-approval/release-approval-manifest.json"
          python3 scripts/release_contract.py extract-instance \
            --manifest "${RUNNER_TEMP}/release-approval/release-approval-manifest.json" \
            --output "${RUNNER_TEMP}/release-approval/release-acceptance-instance.json"
          cp "${RUNNER_TEMP}/candidate-contract/release-freeze-provenance.json" \
            "${RUNNER_TEMP}/release-approval/release-freeze-provenance.json"
          cp "${RUNNER_TEMP}/abschlussmatrix.md" \
            "${RUNNER_TEMP}/release-approval/abschlussmatrix.md"
      - name: Freigabemanifest als Actions-Artefakt sichern
        if: inputs.platforms == 'alle'
        uses: actions/upload-artifact@v7
        with:
          name: release-approval-manifest-${{ github.run_attempt }}
          path: ${{ runner.temp }}/release-approval/
          if-no-files-found: error
          retention-days: 90
      - name: Hinweis auf ausgelassenes Freigabemanifest (Einzelplattform-Lauf)
        # Sichtbar statt still uebersprungen (dasselbe ADR-Prinzip wie beim
        # pausierten x86_64-Pfad oben): dieser Lauf deckt bewusst nur
        # ${{ inputs.platforms }} ab und kann daher kein Freigabemanifest
        # erzeugen - die Abschlussmatrix oben bleibt trotzdem als
        # Diagnose-Nachweis erhalten (z. B. fuer den Update-Nachweis,
        # #741/#748/#917).
        if: inputs.platforms != 'alle'
        run: |
          echo "::notice title=Kein Freigabemanifest::Dieser Lauf deckt bewusst nur '${{ inputs.platforms }}' ab (z. B. Runbook-Schritt 9/Update-Nachweis) statt der vollen Drei-Plattform-Matrix und erzeugt daher kein Freigabemanifest. Fuer eine Veroeffentlichung ist ein separater Lauf mit platforms=alle noetig."
      # Stufe 3b aus #919: Dieser Lauf ist der letzte der Kette und der
      # einzige, der die beiden Post-Release-Kriterien tatsaechlich erbringt.
      # Er zieht deshalb die publish-seitige Instanz nach, ergaenzt sie um die
      # eigenen Update-Check-Befunde und validiert erstmals bis post-release.
      - name: Release-Instanz des Publish-Laufs laden
        # !cancelled(): Ein fehlgeschlagener Update-Check macht die
        # Abschlussmatrix blockierend, create-approval oben bricht dann ab -
        # und genau in diesem Incident-Fall wird die Instanz mit dem FAIL
        # gebraucht. Ein gewoehnliches "if" haette sie stillschweigend
        # uebersprungen (GitHub ergaenzt implizit success()).
        if: ${{ !cancelled() && inputs.publish_run_id != '' }}
        uses: actions/download-artifact@v8
        with:
          # Bewusst OHNE merge-multiple: Ein wiederholter Publish-Lauf haelt
          # mehrere Versuchsartefakte mit derselben Datei an der Wurzel; sie in
          # ein Verzeichnis zu entpacken machte den geltenden Versuch von der
          # Entpackreihenfolge abhaengig. Das benannte Layout behaelt je
          # Artefakt ein Verzeichnis, select_instance_payload waehlt daraus
          # deterministisch den juengsten Versuch (Regel aus #760/#761).
          pattern: release-acceptance-instance-*
          path: ${{ runner.temp }}/publish-instance
          run-id: ${{ inputs.publish_run_id }}
          github-token: ${{ github.token }}

      - name: Post-Release-Kriterien nachtragen und bis post-release validieren
        if: ${{ !cancelled() && inputs.publish_run_id != '' }}
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/release-instance-final"
          # Die Checkliste dieses Checkouts ist die des Kandidaten-Commits:
          # candidate-source vergleicht GITHUB_SHA hart mit dem Kandidaten-SHA,
          # der Dispatch laeuft also zwangslaeufig auf dessen Stand. Die
          # Instanz pinnt genau diesen Dateihash.
          python3 scripts/release_contract.py finalize-instance \
            --checklist "docs/RELEASE_ACCEPTANCE_CHECKLIST.md" \
            --instance "${RUNNER_TEMP}/publish-instance" \
            --evidence-dir "${RUNNER_TEMP}/abnahme-evidenz" \
            --run-url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            --output "${RUNNER_TEMP}/release-instance-final/release-acceptance-instance.json" \
            | tee "${RUNNER_TEMP}/release-instance-final/finalize.log"

      - name: Finale Release-Instanz sichern und rendern
        # !cancelled() statt success(): Blockiert die Validierung oben (ein
        # FAIL oder ein noch offenes Kriterium), ist genau diese Instanz die
        # Evidenz dafuer - sie darf nicht mit dem roten Schritt verschwinden.
        if: ${{ !cancelled() && inputs.publish_run_id != '' }}
        run: |
          set -euo pipefail
          instance="${RUNNER_TEMP}/release-instance-final/release-acceptance-instance.json"
          test -f "$instance" || {
            echo "::warning::Keine finale Release-Instanz erzeugt; Ursache steht im vorherigen Schritt."
            exit 0
          }
          {
            echo "## Finale Release-Instanz $(jq -r .release_version "$instance")"
            echo
            echo "| Kriterium | Phase | Pflichtgrad | Status |"
            echo "|---|---|---|---|"
            jq -r '.criteria[] | "| `\(.id)` | \(.phase) | \(.requirement) | `\(.status)` |"' \
              "$instance"
          } | tee "${RUNNER_TEMP}/release-instance-final/release-instance.md" \
            >> "$GITHUB_STEP_SUMMARY"

      - name: Finale Release-Instanz als Actions-Artefakt sichern
        if: ${{ !cancelled() && inputs.publish_run_id != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: release-acceptance-instance-final-${{ github.run_attempt }}
          path: ${{ runner.temp }}/release-instance-final/
          if-no-files-found: warn
          retention-days: 90

      - name: Finale Release-Instanz als Issue-Kommentar posten
        if: ${{ !cancelled() && inputs.publish_run_id != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_ISSUE: ${{ inputs.target_issue }}
        run: |
          set -euo pipefail
          report="${RUNNER_TEMP}/release-instance-final/release-instance.md"
          test -f "$report" || exit 0
          if [ -z "$TARGET_ISSUE" ]; then
            echo "::notice title=Kein Issue-Kommentar::target_issue ist leer; Instanz bleibt Artefakt und Job-Summary."
            exit 0
          fi
          [[ "$TARGET_ISSUE" =~ ^[1-9][0-9]*$ ]] \
            || { echo "::error::target_issue muss leer oder eine positive Issue-Nummer sein."; exit 1; }
          gh issue comment "$TARGET_ISSUE" --repo "${GITHUB_REPOSITORY}" --body-file "$report"

      - name: Matrix als Issue-Kommentar posten
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_ISSUE: ${{ inputs.target_issue }}
        run: |
          set -euo pipefail
          # Leer heisst ausdruecklich "nicht kommentieren" (#919): Der
          # Publish-Lauf reicht seinen eigenen leeren Wert durch, und dessen
          # Zusage "Leer = nur Artefakt und Job-Summary" muss auch im
          # ausgeloesten Lauf gelten. Ein Nicht-Wunsch darf nicht als
          # Schreibvorgang in ein fremdes Issue enden.
          if [ -z "$TARGET_ISSUE" ]; then
            echo "::notice title=Kein Issue-Kommentar::target_issue ist leer; Matrix bleibt Artefakt und Job-Summary."
            exit 0
          fi
          if [[ ! "$TARGET_ISSUE" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::target_issue muss leer oder eine positive Issue-Nummer sein."
            exit 1
          fi
          gh issue comment "$TARGET_ISSUE" --repo "${GITHUB_REPOSITORY}" \
            --body-file "${RUNNER_TEMP}/abschlussmatrix.md"
