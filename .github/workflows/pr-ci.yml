name: PR CI

on:
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pr-check:
    name: Lightweight PR checks
    runs-on: ubuntu-latest
    steps:
      # Das fail-closed Release-Freeze-Gate braucht Basis-Tag und First-Parent-
      # Historie. Ohne vollständigen Checkout würden neue, unklassifizierte
      # Pfade erst beim Release statt schon im verursachenden PR auffallen.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: "Upgrade pip to a patched release (security: pip>=26.1.2)"
        run: python -m pip install --upgrade "pip>=26.1.2"

      - name: System packages for Qt + zsh + shellcheck
        run: bash scripts/install_qt_apt.sh zsh shellcheck

      - name: Run lightweight PR checks
        run: make pr-check
